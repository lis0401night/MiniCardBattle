<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />
    <title>Mini Card Battle</title>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-L9FM6VBW38"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-L9FM6VBW38');

    <!-- iOS サファリ等でのホーム画面追加時のフルスクリーン対応 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MCB" />
    <meta name="theme-color" content="#000000" />
    <!-- ホーム画面に追加した際のアイコン設定 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./apple-touch-icon.png" />

    <!-- Android等でのPWA完全対応用マニフェスト -->
    <link rel="manifest" href="./manifest.json" />
    <script>
      // エラーログをサーバーに送信する軽量関数（モジュール読み込み前でも動作）
      // モジュール側の reportError が利用可能になったらそちらに委譲する
      var __errorLogCount = 0;
      function _sendErrorLog(type, message, stack) {
        try {
          // モジュール側のレートリミット付き関数が利用可能ならそちらを使う
          if (window.__reportError) {
            window.__reportError(type, message, stack);
            return;
          }
          // モジュール読み込み前のフォールバック: 直接fetchで送信（最大3件）
          if (__errorLogCount >= 3) return;
          __errorLogCount++;
          var uuid = '';
          try {
            uuid = localStorage.getItem('mini_card_battle_uuid') || '';
          } catch (e) {}
          fetch('api/log_error.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: type,
              message: String(message).substring(0, 2000),
              stack: String(stack || '').substring(0, 3000),
              uuid: uuid,
              screen: 'pre-module',
              userAgent: navigator.userAgent || '',
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      }

      window.onerror = function (msg, url, line, col, error) {
        // Safariの共有メニューやブラウザ拡張機能などが引き起こす、ゲームと無関係なクロスオリジンエラーを無視する
        if (msg === 'Script error.' && line === 0) return true;

        // エラーログをサーバーに送信
        _sendErrorLog(
          'unhandled_error',
          msg,
          error ? error.stack : 'Line:' + line + ' URL:' + url
        );

        if (typeof showErrorModal === 'function') {
          showErrorModal(msg + '\nLine: ' + line + '\nURL: ' + url);
        } else {
          alert('Critical Error: ' + msg + '\nLine: ' + line + '\nURL: ' + url);
        }
      };
      window.addEventListener('unhandledrejection', function (event) {
        // エラーログをサーバーに送信
        var reason = event.reason;
        var stack = reason && reason.stack ? reason.stack : '';
        _sendErrorLog('unhandled_rejection', String(reason), stack);

        alert('Unhandled Promise Rejection: ' + event.reason);
      });
      const origConsoleError = console.error;
      console.error = function (...args) {
        origConsoleError.apply(console, args);
        // Ignore benign React DevTools errors or warnings
        const msg = args.join(' ');
        if (msg.includes('Warning:') || msg.includes('react-devtools')) return;
        // React render crash alert
        if (
          msg.includes('Uncaught') ||
          msg.includes('Minified React error') ||
          msg.includes('is not defined') ||
          msg.includes('read properties')
        ) {
          alert('React Rendering Error: ' + msg.substring(0, 200));
        }
      };
    </script>
    <style>
      #app-pre-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #0f172a; /* Slate 900 */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: #facc15; /* Yellow 400 */
        font-family:
          'Outfit',
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      .pre-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(250, 204, 21, 0.1);
        border-top: 4px solid #facc15;
        border-radius: 50%;
        animation: pre-spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .pre-text {
        font-size: 1.1rem;
        font-weight: bold;
        letter-spacing: 3px;
        animation: pre-pulse 1.5s ease-in-out infinite;
      }
      @keyframes pre-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pre-pulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <!-- アプリケーションのUIコンポーネントがここに動的に挿入されます -->
    <div id="app-container">
      <div id="app-pre-loader">
        <div class="pre-spinner"></div>
        <div class="pre-text">LOADING...</div>
      </div>
    </div>

    <!-- メインエントリー -->
    <script type="module" async src="/src/main.jsx"></script>
  </body>
</html>
