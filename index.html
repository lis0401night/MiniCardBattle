<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 最高の互換性を持つ超高速 LocalStorage 暗号化・難読化フック（モジュール評価前の競合を完全解決）
      (function () {
        if (typeof window === 'undefined' || !window.localStorage) return;
        if (window.__localStorageHooked) return; // 二重フック防止
        window.__localStorageHooked = true;

        var origGetItem = localStorage.getItem.bind(localStorage);
        var origSetItem = localStorage.setItem.bind(localStorage);

        var GAME_KEY_PREFIX = 'mini_card_battle_';
        var ENCRYPTION_PREFIX = '_mcb_enc_';
        var OLD_ENCRYPTION_PREFIX = '\u200B\u200C\u200D_';
        var BASE_XOR_KEY = 'arakia_card_battle_secret_key_2026';

        window.__origGetItem = origGetItem;
        window.__origSetItem = origSetItem;

        function xorScramble(text, key) {
          var salt = 0;
          for (var i = 0; i < key.length; i++) {
            salt = (salt << 5) - salt + key.charCodeAt(i);
            salt |= 0;
          }
          salt = Math.abs(salt);

          var dynamicKey = BASE_XOR_KEY + key;
          var result = '';
          for (var j = 0; j < text.length; j++) {
            var charCode =
              text.charCodeAt(j) ^
              dynamicKey.charCodeAt((j + salt) % dynamicKey.length);
            result += String.fromCharCode(charCode);
          }
          return result;
        }

        function hasEncryptionPrefix(text) {
          if (!text || typeof text !== 'string') return false;
          if (text.indexOf(ENCRYPTION_PREFIX) === 0) return true;
          if (text.indexOf(OLD_ENCRYPTION_PREFIX) === 0) return true;

          var underscoreIdx = text.indexOf('_');
          if (underscoreIdx === 0) {
            underscoreIdx = text.indexOf('_', 1);
          }
          if (underscoreIdx !== -1 && underscoreIdx < 15) {
            var prefix = text.substring(0, underscoreIdx);
            var hasZeroWidth = /[\u200B-\u200D]/.test(prefix);
            var hasNonAscii = /[^\x00-\x7F]/.test(prefix);
            if (hasZeroWidth || hasNonAscii || prefix.indexOf('enc') !== -1) {
              return true;
            }
          }
          return false;
        }

        function decryptOnce(encryptedText, key) {
          if (!encryptedText || typeof encryptedText !== 'string')
            return encryptedText;
          if (!hasEncryptionPrefix(encryptedText)) return encryptedText;

          var cipher = encryptedText;
          if (encryptedText.indexOf(ENCRYPTION_PREFIX) === 0) {
            cipher = encryptedText.substring(ENCRYPTION_PREFIX.length);
          } else if (encryptedText.indexOf(OLD_ENCRYPTION_PREFIX) === 0) {
            cipher = encryptedText.substring(OLD_ENCRYPTION_PREFIX.length);
          } else {
            var underscoreIdx = encryptedText.indexOf('_');
            if (underscoreIdx === 0) {
              underscoreIdx = encryptedText.indexOf('_', 1);
            }
            if (underscoreIdx !== -1) {
              cipher = encryptedText.substring(underscoreIdx + 1);
            }
          }

          try {
            if (!cipher || cipher.trim() === '') return null;

            // atob() の実行前に、Base64文字列からすべてのゼロ幅スペースを完全に除去する
            cipher = cipher.replace(/[\u200B-\u200D]/g, '');

            if (
              cipher.indexOf('{') === 0 ||
              cipher.indexOf('[') === 0 ||
              cipher.indexOf('"') === 0
            )
              return cipher;

            var scrambled = atob(cipher);
            var binaryString = xorScramble(scrambled, key);

            // 本番の3種類（平文、31972b63 方式、現在方式）を安全に復元する
            // 31972b63 方式と現在方式は、どちらもUTF-8バイナリをXORしたものであり、
            // TextDecoder もしくは escape 方式で100%完璧に同一の平文へと復元されます。
            var decoded;
            try {
              if (typeof TextDecoder !== 'undefined') {
                var bytes = new Uint8Array(binaryString.length);
                for (var i = 0; i < binaryString.length; i++) {
                  bytes[i] = binaryString.charCodeAt(i);
                }
                decoded = new TextDecoder('utf-8').decode(bytes);
              } else {
                decoded = decodeURIComponent(escape(binaryString));
              }
            } catch (errX) {
              try {
                decoded = decodeURIComponent(escape(binaryString));
              } catch (errY) {
                decoded = binaryString;
              }
            }

            if (decoded && typeof decoded === 'string') {
              decoded = decoded.replace(/[\u200B-\u200D]/g, '');
            }

            return decoded;
          } catch (e) {
            return encryptedText;
          }
        }

        function decrypt(encryptedText, key) {
          if (!encryptedText || typeof encryptedText !== 'string')
            return encryptedText;
          if (
            encryptedText.indexOf('{') === 0 ||
            encryptedText.indexOf('[') === 0 ||
            encryptedText.indexOf('"') === 0
          )
            return encryptedText;

          var firstDecrypted = decryptOnce(encryptedText, key);

          if (firstDecrypted && typeof firstDecrypted === 'string') {
            var isStillEncrypted =
              firstDecrypted.indexOf(ENCRYPTION_PREFIX) === 0 ||
              firstDecrypted.indexOf(OLD_ENCRYPTION_PREFIX) === 0 ||
              firstDecrypted.indexOf('enc_') === 0 ||
              (firstDecrypted.indexOf('_') !== -1 &&
                firstDecrypted.indexOf('_') < 15);

            if (isStillEncrypted) {
              var recovered = decryptOnce(firstDecrypted, key);
              if (recovered !== null && recovered !== firstDecrypted) {
                return recovered;
              }
            }
          }
          return firstDecrypted;
        }

        localStorage.getItem = function (key) {
          if (!key || key.indexOf(GAME_KEY_PREFIX) !== 0) {
            return origGetItem(key);
          }
          var raw = origGetItem(key);
          if (
            raw === null ||
            raw === undefined ||
            raw === '' ||
            raw === 'null' ||
            raw === 'undefined' ||
            raw === 'NaN'
          )
            return null;
          if (raw === ENCRYPTION_PREFIX || raw === OLD_ENCRYPTION_PREFIX)
            return null;

          var decrypted = decrypt(raw, key);
          if (
            decrypted === null ||
            decrypted === undefined ||
            decrypted === '' ||
            decrypted === 'null' ||
            decrypted === 'undefined' ||
            decrypted === 'NaN'
          )
            return null;

          // 自動マイグレーション（暗号化データを検出したら、即座に平文に戻して保存する）
          if (
            raw &&
            (raw.indexOf(ENCRYPTION_PREFIX) === 0 ||
              raw.indexOf(OLD_ENCRYPTION_PREFIX) === 0)
          ) {
            try {
              origSetItem(key, decrypted);
            } catch (e) {}
          }
          return decrypted;
        };

        localStorage.setItem = function (key, value) {
          if (!key || key.indexOf(GAME_KEY_PREFIX) !== 0) {
            origSetItem(key, value);
            return;
          }

          if (key === 'mini_card_battle_volume') {
            var numVal = parseFloat(value);
            if (isNaN(numVal) || !isFinite(numVal)) {
              value = '0.5';
            }
          }

          if (
            value === null ||
            value === undefined ||
            value === '' ||
            value === 'null' ||
            value === 'undefined'
          ) {
            localStorage.removeItem(key);
            return;
          }

          var textValue = typeof value === 'string' ? value : String(value);
          if (textValue.trim() === '') {
            localStorage.removeItem(key);
            return;
          }

          // 今後は暗号化を一切行わず、そのまま平文で格納
          origSetItem(key, textValue);
        };

        // 起動時自動マイグレーション（暗号化データの平文一括書き戻し）
        try {
          var keysToMigrate = [];
          for (var k = 0; k < localStorage.length; k++) {
            var keyName = localStorage.key(k);
            if (keyName && keyName.indexOf(GAME_KEY_PREFIX) === 0) {
              var rawVal = origGetItem(keyName);
              if (
                rawVal &&
                rawVal.trim() !== '' &&
                (rawVal.indexOf(ENCRYPTION_PREFIX) === 0 ||
                  rawVal.indexOf(OLD_ENCRYPTION_PREFIX) === 0)
              ) {
                keysToMigrate.push({ key: keyName, raw: rawVal });
              }
            }
          }
          for (var idx = 0; idx < keysToMigrate.length; idx++) {
            var item = keysToMigrate[idx];
            var decryptedVal = decrypt(item.raw, item.key);
            if (decryptedVal !== null && decryptedVal !== item.raw) {
              origSetItem(item.key, decryptedVal); // 平文に完全書き戻し
            }
          }
        } catch (e) {}

        // 同期型バージョンチェッカー
        // 【重要設計意図】
        // 後続の ESM モジュール（React/Vite）がロードされて起動する前に、古いキャッシュ破棄と
        // リロードを100%確実に完了させ、新旧コードの競合によるクラッシュ（ゾンビキャッシュ）を
        // 防止するために、意図的に同期 XMLHttpRequest（xhr.open の第3引数を false）を使用しています。
        // ※ navigator.onLine === false（オフライン時）は即座に回避するセーフガードが入っています。
        (function () {
          if (navigator.onLine === false) return;

          // ローカルストレージの命名規則に統一したキー名を使用
          var VERSION_KEY = 'mini_card_battle_version';
          var lastVersion = localStorage.getItem(VERSION_KEY);

          try {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', './version.json?t=' + Date.now(), false);
            xhr.send(null);

            if (xhr.status === 200) {
              var data = JSON.parse(xhr.responseText);
              if (data && data.version) {
                var hasPwa =
                  !!(
                    navigator.serviceWorker &&
                    navigator.serviceWorker.controller
                  ) || !!(window.caches && localStorage.length > 0);

                if (lastVersion !== data.version && hasPwa) {
                  var promises = [];

                  if (navigator.serviceWorker) {
                    var swPromise = navigator.serviceWorker
                      .getRegistrations()
                      .then(function (regs) {
                        var swTasks = [];
                        for (var i = 0; i < regs.length; i++) {
                          swTasks.push(
                            regs[i].unregister().catch(function () {})
                          );
                        }
                        return Promise.all(swTasks);
                      })
                      .catch(function () {});
                    promises.push(swPromise);
                  }

                  if (window.caches) {
                    var cachePromise = caches
                      .keys()
                      .then(function (keys) {
                        var cacheTasks = [];
                        keys.forEach(function (key) {
                          cacheTasks.push(
                            caches.delete(key).catch(function () {})
                          );
                        });
                        return Promise.all(cacheTasks);
                      })
                      .catch(function () {});
                    promises.push(cachePromise);
                  }

                  // タイムアウト用Promise (最大1200ms待つ)
                  var timeoutPromise = new Promise(function (resolve) {
                    setTimeout(resolve, 1200);
                  });

                  // すべて完了するか、タイムアウトしたらバージョンを確定してリロード
                  Promise.race([Promise.all(promises), timeoutPromise]).then(
                    function () {
                      localStorage.setItem(VERSION_KEY, data.version);
                      window.location.reload(true);
                    }
                  );

                  return;
                } else {
                  localStorage.setItem(VERSION_KEY, data.version);
                }
              }
            }
          } catch (e) {
            // エラー時は安全に無視
          }
        })();
      })();
    </script>

    <script>
      // エラーログをサーバーに送信する軽量関数（モジュール読み込み前でも動作）
      // モジュール側の reportError が利用可能になったらそちらに委譲する
      var __errorLogCount = 0;
      function _sendErrorLog(type, message, stack) {
        try {
          // モジュール側のレートリミット付き関数が利用可能ならそちらを使う
          if (window.__reportError) {
            window.__reportError(type, message, stack);
            return;
          }
          // モジュール読み込み前のフォールバック: 直接fetchで送信（最大3件）
          if (__errorLogCount >= 3) return;
          __errorLogCount++;
          var uuid = '';
          try {
            uuid = localStorage.getItem('mini_card_battle_uuid') || '';
          } catch (e) {}
          fetch('api/log_error.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: type,
              message: String(message).substring(0, 2000),
              stack: String(stack || '').substring(0, 3000),
              uuid: uuid,
              screen: 'pre-module',
              userAgent: navigator.userAgent || '',
            }),
            keepalive: true,
          }).catch(function () {});
        } catch (e) {}
      }

      window.onerror = function (msg, url, line, col, error) {
        // Safariの共有メニューやブラウザ拡張機能などが引き起こす、ゲームと無関係なクロスオリジンエラーを無視する
        if (msg === 'Script error.' && line === 0) return true;

        // ResizeObserverの無害なブラウザ仕様ループ通知はスキップする
        var strMsg = String(msg || '');
        if (
          strMsg.indexOf(
            'ResizeObserver loop completed with undelivered notifications'
          ) !== -1 ||
          strMsg.indexOf('ResizeObserver loop limit exceeded') !== -1
        ) {
          return true;
        }

        // エラーログをサーバーに送信
        _sendErrorLog(
          'unhandled_error',
          msg,
          error ? error.stack : 'Line:' + line + ' URL:' + url
        );

        if (typeof showErrorModal === 'function') {
          showErrorModal(msg + '\nLine: ' + line + '\nURL: ' + url);
        } else {
          alert('Critical Error: ' + msg + '\nLine: ' + line + '\nURL: ' + url);
        }
      };
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var strReason = String(reason || '');
        if (
          strReason.indexOf(
            'ResizeObserver loop completed with undelivered notifications'
          ) !== -1 ||
          strReason.indexOf('ResizeObserver loop limit exceeded') !== -1
        ) {
          return;
        }

        // エラーログをサーバーに送信
        var stack = reason && reason.stack ? reason.stack : '';
        _sendErrorLog('unhandled_rejection', strReason, stack);

        alert('Unhandled Promise Rejection: ' + event.reason);
      });
      const origConsoleError = console.error;
      console.error = function (...args) {
        origConsoleError.apply(console, args);
        // Ignore benign React DevTools errors or warnings, or ResizeObserver loop notifications
        const msg = args.join(' ');
        if (
          msg.includes('Warning:') ||
          msg.includes('react-devtools') ||
          msg.includes(
            'ResizeObserver loop completed with undelivered notifications'
          ) ||
          msg.includes('ResizeObserver loop limit exceeded')
        ) {
          return;
        }
        // React render crash alert
        if (
          msg.includes('Uncaught') ||
          msg.includes('Minified React error') ||
          msg.includes('is not defined') ||
          msg.includes('read properties')
        ) {
          alert('React Rendering Error: ' + msg.substring(0, 200));
        }
      };
    </script>

      #app-pre-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

        border-top: 4px solid #facc15;
        border-radius: 50%;
        animation: pre-spin 1s linear infinite;
        margin-bottom: 20px;
      }
      .pre-text {
        font-size: 1.1rem;
        font-weight: bold;
        letter-spacing: 3px;
        animation: pre-pulse 1.5s ease-in-out infinite;
      }
      @keyframes pre-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes pre-pulse {

        100% {

        }

          opacity: 1;
        }
      }
