<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Evaluator - 高度なデッキ分析システム</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .scroll-custom::-webkit-scrollbar {
        width: 6px;
      }

      .scroll-custom::-webkit-scrollbar-track {
        background: transparent;
      }

      .scroll-custom::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .scroll-custom::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Analysis画面のレイアウト：左右の高さを画面に固定 */
      .analysis-container {
        display: flex;
        gap: 1.5rem;
        height: calc(100vh - 140px);
        min-height: 500px;
      }

      .panel-scroll {
        flex: 1;
        height: 100%;
        overflow-y: auto;
      }

      /* アニメーション */
      .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }

      @media (max-width: 1024px) {
        .analysis-container {
          flex-direction: column;
          height: auto;
        }

        .panel-scroll {
          height: auto;
          max-height: 600px;
          overflow-y: auto;
        }
      }
    </style>
  </head>

      <!-- Main View (Analysis) -->

          >
            <div>
              <h2
                class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1"

              </div>

            <div class="flex items-center gap-3">
              <span

                  <th class="p-2 md:p-4 w-2/12">使用状況</th>
                  <th
                    class="p-2 md:p-4 w-12 md:w-16 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    onclick="window.resort('power')"
                  >
                    パワー
                  </th>
                  <th class="p-2 md:p-4">スキル</th>
                  <th
                    class="p-2 md:p-4 w-24 md:w-28 text-right text-indigo-600 cursor-pointer hover:bg-indigo-50"
                    onclick="window.resort('score')"
                  >
                    評価スコア ▼
                  </th>
                </tr>
              </thead>
              <tbody id="card-table-body" class="divide-y divide-slate-100">

              </tbody>
            </table>

        </div>

        <!-- Right: Config Panel -->

        >
          <div
            class="p-4 md:p-5 border-b border-slate-800 bg-slate-900/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2"
          >
            <div>
              <h2
                class="text-xs font-black uppercase tracking-widest text-slate-500 mb-1"
              >
                パラメーター
              </h2>
              <div class="text-xl font-black text-white tracking-tight">
                ポイント設定
              </div>
            </div>
            <div

              計算式:<br /><span class="text-indigo-400"

            </div>
          </div>

          <div
            id="points-grid"
            class="panel-scroll scroll-custom p-3 md:p-4 grid grid-cols-1 xl:grid-cols-2 gap-3"
          >
            <!-- JS Injection -->
          </div>
        </div>
      </div>

      <!-- Decks View -->
      <div id="view-decks" class="hidden w-full px-2 md:px-4 pb-20">
        <div
          id="decks-container"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4 md:gap-8 max-w-[1400px] mx-auto py-6"
        >
          <!-- JS Injection -->
        </div>

        <!-- Unused Cards Section -->
        <div
          class="max-w-[1400px] mx-auto mt-12 bg-white rounded-3xl p-6 md:p-10 border border-slate-200 shadow-sm"
        >
          <div class="flex flex-col items-center mb-8">
            <div class="bg-slate-100 p-3 rounded-2xl mb-4">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-6 h-6 text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
                />
              </svg>
            </div>
            <h3
              class="font-black text-slate-800 uppercase tracking-[0.2em] italic text-lg text-center"
            >
              アーカイブ: 未使用資産
            </h3>
            <p
              class="text-slate-400 text-xs font-medium mt-1 uppercase tracking-wider text-center"
            >
              現在どのデッキにも割り当てられていないカード
            </p>
          </div>
          <div
            id="unused-cards-container"
            class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-3 md:gap-4"

            <!-- JS Injection -->

    <!-- Data Engine Logic (ES6 Module Support) -->
    <script type="module">
      let cardData = [];
      let skillData = {};
      let deckData = {};
      let pointSettings = {};
      let currentSort = { key: 'score', dir: 'desc' };

      // グローバルに露出
      window.switchView = switchView;
      window.exportSettings = exportSettings;
      window.resort = resort;
      window.updatePoint = updatePoint;

      async function init() {
        try {
          // ESMを使ってモジュールとしてインポート
          const cardsModule = await import('./src/utils/constants/cards.js');
          const skillsModule = await import('./src/utils/constants/skills.js');
          const skillPointsModule =
            await import('./src/utils/constants/skill_points.js');

          cardData = (cardsModule.CARD_MASTER || []).filter((c) => !c.isToken);
          skillData = skillsModule.SKILLS || {};
          pointSettings = skillPointsModule.SKILL_POINTS || {};

          // 敵デッキをダイナミックインポート
          const deckFiles = [
            'android',
            'dragon',
            'knight',
            'cthulhu',
            'elf',
            'cleric',
            'devilhunter',
            'witch',
            'oni',
            'satan',
            'void',
            'succubus',
            'priest',
            'android_high',
            'dragon_high',
            'knight_high',
            'cthulhu_high',
            'elf_high',
            'cleric_high',
            'devilhunter_high',
            'witch_high',
            'oni_high',
            'satan_high',
            'priest_high',
          ];
          for (const file of deckFiles) {
            try {
              const isHigh = file.endsWith('_high');
              let deckModule;
              if (isHigh) {
                const cleanFile = file.replace('_high', '');
                deckModule = await import(
                  `./src/utils/constants/enemy_decks/event_high/${cleanFile}.js`
                );
              } else {
                deckModule = await import(
                  `./src/utils/constants/enemy_decks/${file}.js`
                );
              }
              const deck =
                deckModule.default ||
                deckModule[file] ||
                deckModule[file.replace('_high', '')] ||
                deckModule.ENEMY_DECKS?.[file] ||
                deckModule.ENEMY_DECKS?.[file.replace('_high', '')];
              if (deck) {
                if (isHigh) {
                  const baseChar = file.replace('_high', '');
                  if (!deckData[baseChar]) {
                    deckData[baseChar] = {};
                  }
                  deckData[baseChar]['high'] = Array.isArray(deck)
                    ? deck
                    : deck.normal || deck.hard || [];
                } else {
                  if (!deckData[file]) {
                    deckData[file] = {};
                  }
                  if (Array.isArray(deck)) {
                    deckData[file]['Extra'] = deck;
                  } else {
                    Object.assign(deckData[file], deck);
                  }
                }
              }
            } catch (e) {
              console.warn(`Deck load skipped/failed for: ${file}`, e);
            }
          }

          // スキル設定の不足分を補完
          Object.keys(skillData).forEach((k) => {
            if (k !== 'none' && !pointSettings[k]) {
              pointSettings[k] = { base: 0, multiplier: 0 };
            }
          });

          document.getElementById('loading-overlay').classList.add('hidden');
          document.getElementById('view-main').classList.remove('hidden');
          renderAll();
        } catch (err) {
          console.error('初期化失敗:', err);
          document.getElementById('loading-overlay').innerHTML =
            `<div class="text-red-500 font-bold bg-red-100 p-4 rounded-xl">データの読み込みに失敗しました。モジュールエラー(CORS等)の可能性があります。ローカルサーバー経由でアクセスしてください。</div><div class="text-xs text-slate-500 mt-2">${err.message}</div>`;
        }
      }

      function calculateScore(card) {
        let score = card.power || 0;
        const activeSkills = [];
        if (card.skills)
          card.skills.forEach((sk) =>
            activeSkills.push({
              id: sk.id,
              val: sk.value || 0,
              choiceGroup: sk.choiceGroup,
            })
          );

        // 倍化と減衰の特殊処理（ベースパワーの書き換え）
        if (activeSkills.some((sk) => sk.id === 'double_power')) {
          score = (card.power || 0) * 2 + 1;
        } else if (activeSkills.some((sk) => sk.id === 'decay')) {
          score = Math.floor((card.power || 0) / 2) + 1;
        }

        // 同一スキル（ID+value+choiceGroup）を集約
        const groupedSkills = [];
        activeSkills.forEach((sk) => {
          const key = `${sk.id}_${sk.val}_${sk.choiceGroup ?? ''}`;
          const existing = groupedSkills.find((g) => g.key === key);
          if (existing) {
            existing.count++;
          } else {
            groupedSkills.push({ ...sk, key, count: 1 });
          }
        });

        groupedSkills.forEach((sk) => {
          if (sk.id === 'double_power' || sk.id === 'decay') return;
          if (sk.id === 'sturdy' || sk.id === 'absorb') {
            // 頑丈・吸収はパワー4につき1点（端数切り上げ。パワー5なら2点）
            score += Math.ceil((card.power || 0) / 4) * sk.count;
            return;
          }
          if (sk.id === 'dodge') {
            // 回避は5を基準に5未満なら1+(5-val)点、5以上なら1点
            const val = sk.val === undefined || sk.val === 0 ? 5 : sk.val;
            const dodgeScore = val >= 5 ? 1 : 1 + (5 - val);
            score += dodgeScore * sk.count;
            return;
          }

          const choicesArr =
            sk.choiceGroup === 2 ? card.choices2 : card.choices;
          if (
            (sk.id === 'choice' || sk.id === 'force') &&
            Array.isArray(choicesArr) &&
            choicesArr.length > 0
          ) {
            let choiceTotal = 0;
            choicesArr.forEach((cho) => {
              const p = pointSettings[cho.id] || { base: 0, multiplier: 0 };
              const choVal =
                cho.value === undefined || cho.value === 0 ? 1 : cho.value;
              choiceTotal +=
                Number(p.base || 0) +
                Number(choVal) * Number(p.multiplier || 0);
            });
            const pickCount = sk.val === undefined || sk.val === 0 ? 1 : sk.val;
            const selfBaseSkillP = pointSettings[sk.id] || {
              base: 0,
              multiplier: 0,
            };
            const selfScore =
              Number(selfBaseSkillP.base || 0) +
              Number(pickCount) * Number(selfBaseSkillP.multiplier || 0);

            const avgScore = (choiceTotal / choicesArr.length) * pickCount;
            // 命令の場合は -1 の補正
            const penalty = sk.id === 'force' ? -1 : 0;
            score += avgScore + penalty + selfScore;
          } else {
            // baseは1回分のみ、value*multiplierは個数(count)分加算
            const p = pointSettings[sk.id] || { base: 0, multiplier: 0 };
            const value = sk.val === undefined || sk.val === 0 ? 1 : sk.val;
            score +=
              Number(p.base || 0) +
              Number(value) * Number(p.multiplier || 0) * sk.count;
          }
        });

        if (activeSkills.some((sk) => sk.id === 'defender')) {
          score = score / 2;
        }

        return Math.round(score * 10) / 10;
      }

      function getUsage(cardId) {
        const usage = [];
        Object.entries(deckData).forEach(([char, diffs]) => {
          Object.entries(diffs).forEach(([diff, ids]) => {
            if (Array.isArray(ids) && ids.includes(cardId))
              usage.push({ char, diff });
          });
        });
        return usage;
      }

      function renderCards() {
        const tbody = document.getElementById('card-table-body');
        const sorted = [...cardData].sort((a, b) => {
          let av =
            currentSort.key === 'score'
              ? calculateScore(a)
              : a[currentSort.key];
          let bv =
            currentSort.key === 'score'
              ? calculateScore(b)
              : b[currentSort.key];
          if (typeof av === 'string')
            return currentSort.dir === 'desc'
              ? bv.localeCompare(av)
              : av.localeCompare(bv);
          return currentSort.dir === 'desc' ? bv - av : av - bv;
        });

        document.getElementById('card-count').innerText =
          `${sorted.length} 枚読込完了`;

        tbody.innerHTML = sorted
          .map((c, idx) => {
            const score = calculateScore(c);
            const usage = getUsage(c.id);

            return `
                <tr class="hover:bg-indigo-50/30 transition-all border-b border-slate-100 last:border-0 group">
                    <td class="p-2 md:p-4 text-center text-[10px] font-black text-slate-300 group-hover:text-indigo-400 transition-colors">${idx + 1}</td>
                    <td class="p-2 md:p-4">
                        <div class="font-black text-slate-800 truncate text-xs md:text-sm mb-0.5 tracking-tight">${c.name}</div>
                        <div class="flex flex-wrap items-center gap-1 md:gap-2 text-[10px]">
                            <span class="font-mono font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded uppercase tracking-tighter">${c.id}</span>
                            <span class="font-black text-amber-500 uppercase tracking-widest">${'★'.repeat(c.rarity || 1)}</span>
                        </div>
                    </td>
                    <td class="p-2 md:p-4">
                        <div class="flex flex-wrap gap-1 md:gap-1.5">
                            ${
                              usage.length > 0
                                ? usage
                                    .map(
                                      (u) => `
                                <span class="text-[8px] md:text-[9px] font-black px-1.5 py-0.5 rounded-md bg-indigo-50 text-indigo-500 border border-indigo-100 uppercase tracking-tighter">
                                    ${u.char.substring(0, 3)}:${u.diff[0]}
                                </span>`
                                    )
                                    .join('')
                                : '<span class="text-[8px] font-bold text-slate-300 uppercase italic tracking-widest">未使用</span>'
                            }
                        </div>
                    </td>
                    <td class="p-2 md:p-4 text-center">
                        <div class="text-xs md:text-sm font-black text-slate-600">${c.power || 0}</div>
                    </td>
                    <td class="p-2 md:p-4">
                        <div class="flex flex-col md:flex-row flex-wrap gap-1 md:gap-2">
                            ${(() => {
                              // 同一スキル（ID+value+choiceGroup）を集約
                              const grouped = [];
                              (c.skills || []).forEach((sk) => {
                                const key = `${sk.id || sk}_${sk.value ?? ''}_${sk.choiceGroup ?? ''}`;
                                const existing = grouped.find(
                                  (g) => g.key === key
                                );
                                if (existing) {
                                  existing.count++;
                                } else {
                                  grouped.push({ ...sk, key, count: 1 });
                                }
                              });
                              return grouped
                                .map((sk) => {
                                  const s = skillData[sk.id || sk] || {
                                    name: sk.id || sk,
                                    icon: '✨',
                                  };
                                  const countSuffix =
                                    sk.count > 1
                                      ? ` <span class="text-indigo-500 font-black">×${sk.count}</span>`
                                      : '';
                                  let html = `
                                <div class="flex items-center gap-1 md:gap-2 px-1.5 md:px-2.5 py-1 rounded-xl bg-slate-100 text-[9px] md:text-[10px] font-bold text-slate-600 border border-slate-200 shadow-sm transition-all hover:bg-white hover:border-indigo-200">
                                    <span class="md:scale-125">${s.icon}</span>
                                    <div class="flex flex-col leading-none">
                                        <span class="text-[6px] md:text-[7px] text-slate-400 uppercase font-black">${s.name}</span>
                                        <span>${sk.value || sk.val || ''}${countSuffix}</span>
                                    </div>
                                </div>`;

                                  const choicesArr =
                                    sk.choiceGroup === 2
                                      ? c.choices2
                                      : c.choices;
                                  if (
                                    (sk.id === 'choice' ||
                                      sk.id === 'force' ||
                                      sk === 'choice' ||
                                      sk === 'force') &&
                                    Array.isArray(choicesArr)
                                  ) {
                                    html += `<div class="flex items-center text-slate-400 font-bold px-1 select-none">⇒</div>`;
                                    html += `<div class="flex flex-wrap gap-1 p-1 bg-indigo-50/50 border border-indigo-200 rounded-xl items-center">`;
                                    html += choicesArr
                                      .map((cho) => {
                                        const cs = skillData[cho.id] || {
                                          name: cho.id,
                                          icon: '✨',
                                        };
                                        return `
                                        <div class="flex items-center gap-1 px-1.5 py-0.5 rounded shadow-sm bg-white border border-slate-200 text-[8px] font-bold text-slate-600">
                                            <span>${cs.icon}</span><span class="uppercase">${cs.name}</span><span>${cho.value || ''}</span>
                                        </div>`;
                                      })
                                      .join('');
                                    html += `</div>`;
                                  }
                                  return html;
                                })
                                .join('');
                            })()}
                        </div>
                    </td>
                    <td class="p-2 md:p-4 text-right">
                        <div class="text-lg md:text-xl font-black text-indigo-600 tracking-tighter">${score.toFixed(1)}</div>
                    </td>
                </tr>`;
          })
          .join('');
      }

      function renderPoints() {
        const grid = document.getElementById('points-grid');
        grid.innerHTML = Object.entries(skillData)
          .filter(([k]) => k !== 'none')
          .map(([k, s]) => {
            const p = pointSettings[k] || { base: 0, multiplier: 0 };

            let settingsArea = `
                    <div class="grid grid-cols-2 gap-2 md:gap-3 mt-auto">
                        <div>
                            <label class="text-[7px] md:text-[8px] font-black text-slate-500 uppercase block mb-1 tracking-widest">基礎点</label>
                            <input type="number" step="0.5" value="${p.base}" oninput="window.updatePoint('${k}', 'base', this.value)" 
                                class="w-full bg-slate-950 text-white px-2 py-1 md:py-2 rounded-xl border border-slate-700 text-right font-black text-[10px] md:text-xs outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all ${k === 'defender' ? 'cursor-not-allowed opacity-50' : ''}" ${k === 'defender' ? 'disabled' : ''}/>
                        </div>
                        <div>
                            <label class="text-[7px] md:text-[8px] font-black text-slate-500 uppercase block mb-1 tracking-widest">倍率</label>
                            <input type="number" step="0.1" value="${p.multiplier}" oninput="window.updatePoint('${k}', 'multiplier', this.value)" 
                                class="w-full bg-slate-950 text-white px-2 py-1 md:py-2 rounded-xl border border-slate-700 text-right font-black text-[10px] md:text-xs outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all ${k === 'defender' ? 'cursor-not-allowed opacity-50' : ''}" ${k === 'defender' ? 'disabled' : ''}/>
                        </div>
                    </div>`;

            if (k === 'defender') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-red-500/30 bg-red-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-red-400 tracking-wider">固定補正</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5">最終評価スコアを 1/2 倍</span>
                    </div>`;
            } else if (k === 'choice') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-indigo-500/30 bg-indigo-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-indigo-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">候補の平均点 × 選択数 + 1<br/>+ 基礎点等</span>
                    </div>`;
            } else if (k === 'force') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-orange-500/30 bg-orange-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-orange-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">候補の平均点 × 選択数 - 1<br/>+ 基礎点等</span>
                    </div>`;
            } else if (k === 'double_power') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-indigo-500/30 bg-indigo-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-indigo-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">パワー × 2 + 1</span>
                    </div>`;
            } else if (k === 'decay') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-red-500/30 bg-red-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-red-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">パワー / 2 + 1</span>
                    </div>`;
            } else if (k === 'sturdy' || k === 'absorb') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-indigo-500/30 bg-indigo-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-indigo-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">パワー / 4 (端数切り上げ)</span>
                    </div>`;
            } else if (k === 'dodge') {
              settingsArea = `
                    <div class="mt-auto h-full flex flex-col items-center justify-center p-2 rounded-xl border border-dashed border-indigo-500/30 bg-indigo-500/5">
                        <span class="text-[9px] md:text-[10px] font-black text-indigo-400 tracking-wider">特殊計算</span>
                        <span class="text-[8px] md:text-[9px] font-bold text-slate-400 mt-0.5 text-center">5未満: 1 + (5 - 値)<br/>5以上: 1</span>
                    </div>`;
            }

            return `
                <div class="p-4 rounded-2xl bg-slate-800/50 border border-white/5 hover:border-indigo-500/50 transition-all group flex flex-col h-full">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-3">
                            <span class="text-xl md:text-2xl group-hover:scale-125 transition-transform duration-300">${s.icon}</span>
                            <div>
                                <div class="font-black text-[10px] md:text-xs text-white uppercase tracking-tight">${s.name}</div>
                                <div class="text-[8px] font-mono text-slate-500 uppercase">${k}</div>
                            </div>
                        </div>
                    </div>
                    ${settingsArea}
                </div>`;
          })
          .join('');
      }

      function renderDecks() {
        const container = document.getElementById('decks-container');
        container.innerHTML = Object.entries(deckData)
          .map(
            ([char, diffs]) => `
                <div class="bg-white rounded-[2rem] overflow-hidden border border-slate-200 shadow-sm hover:shadow-xl transition-shadow duration-500">
                    <div class="bg-slate-900 px-6 py-4 md:px-8 md:py-5 text-white flex justify-between items-center">
                        <div class="flex items-center gap-3 md:gap-4">
                            <div class="w-8 h-8 md:w-10 md:h-10 bg-indigo-600 rounded-2xl flex items-center justify-center font-black italic text-base md:text-lg shadow-lg shadow-indigo-500/20">${char.charAt(0).toUpperCase()}</div>
                            <h3 class="font-black text-xs md:text-sm tracking-[0.2em] uppercase italic">${char}<span class="hidden md:inline"> デッキ構成</span></h3>
                        </div>
                    </div>
                    <div class="p-4 md:p-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-8">
                        ${Object.entries(diffs)
                          .map(([d, ids]) => {
                            if (!Array.isArray(ids)) return '';
                            const dCards = ids.map(
                              (id) =>
                                cardData.find((c) => c.id === id) || {
                                  id,
                                  name: '不明なカード',
                                  power: 0,
                                }
                            );
                            const total = dCards.reduce(
                              (acc, c) => acc + calculateScore(c),
                              0
                            );
                            return `
                                <div class="bg-slate-50 rounded-[1.5rem] p-4 md:p-6 border border-slate-100 flex flex-col shadow-inner">
                                    <div class="flex justify-between items-end mb-4">
                                        <div>
                                            <span class="text-[9px] md:text-[10px] font-black uppercase text-indigo-500 tracking-widest block mb-1">${d} 難易度</span>
                                            <div class="text-2xl md:text-3xl font-black text-slate-900 tracking-tighter">${Math.round(total)}<span class="text-[10px] md:text-xs ml-1 text-slate-400">pts</span></div>
                                        </div>
                                        <div class="text-[9px] md:text-[10px] font-bold text-slate-400 bg-white px-2 py-1 rounded-lg border border-slate-200 shadow-sm">${ids.length}枚</div>
                                    </div>
                                    <div class="space-y-1.5 md:space-y-2 overflow-y-auto max-h-[200px] md:max-h-[300px] pr-1 md:pr-2 scroll-custom">
                                        ${dCards
                                          .map(
                                            (c) => `
                                            <div class="flex justify-between items-center text-[9px] md:text-[10px] bg-white p-2 md:p-3 rounded-xl border border-slate-100 shadow-sm group hover:border-indigo-300 transition-all">
                                                <div class="truncate pr-2">
                                                    <span class="font-black text-slate-700 block truncate">${c.name}</span>
                                                    <span class="text-[7px] md:text-[8px] font-black text-amber-500">★${c.rarity || 1}</span>
                                                </div>
                                                <span class="font-black text-indigo-600 bg-indigo-50 px-1.5 md:px-2 py-0.5 md:py-1 rounded-lg border border-indigo-100">${calculateScore(c).toFixed(1)}</span>
                                            </div>`
                                          )
                                          .join('')}
                                    </div>
                                </div>`;
                          })
                          .join('')}
                    </div>
                </div>`
          )
          .join('');

        // 未使用カードのレンダリング
        const allUsedIds = new Set();
        Object.values(deckData).forEach((d) => {
          if (typeof d === 'object' && d !== null) {
            Object.values(d).forEach((ids) => {
              if (Array.isArray(ids)) ids.forEach((id) => allUsedIds.add(id));
            });
          }
        });
        const unusedCards = cardData.filter((c) => !allUsedIds.has(c.id));
        const unusedContainer = document.getElementById(
          'unused-cards-container'
        );

        unusedContainer.innerHTML =
          unusedCards.length > 0
            ? unusedCards
                .map(
                  (c) => `
                <div class="bg-white p-3 md:p-4 rounded-2xl border border-slate-200 shadow-sm group hover:border-slate-400 transition-all">
                    <div class="text-[9px] md:text-[10px] font-black text-slate-800 truncate mb-2">${c.name}</div>
                    <div class="flex justify-between items-center">
                        <span class="text-[7px] md:text-[8px] font-black text-slate-400 uppercase tracking-widest">力: ${c.power}</span>
                        <span class="text-[9px] md:text-[10px] font-black text-indigo-400">${calculateScore(c).toFixed(1)}</span>
                    </div>
                </div>`
                )
                .join('')
            : '<div class="col-span-full py-10 text-center text-slate-300 text-xs font-black uppercase tracking-[0.3em]">未使用の資産はありません</div>';
      }

      function renderAll() {
        renderCards();
        renderPoints();
        renderDecks();
      }

      function switchView(viewId) {
        document
          .getElementById('view-main')
          .classList.toggle('hidden', viewId !== 'main');
        document
          .getElementById('view-decks')
          .classList.toggle('hidden', viewId !== 'decks');

        const btnMain = document.getElementById('btn-main');
        const btnDecks = document.getElementById('btn-decks');

        btnMain.className = `px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${viewId === 'main' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'text-slate-400 hover:text-white'}`;
        btnDecks.className = `px-5 py-2 rounded-xl text-xs font-black uppercase tracking-widest transition-all ${viewId === 'decks' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-500/30' : 'text-slate-400 hover:text-white'}`;
      }

      function updatePoint(skillId, field, value) {
        if (!pointSettings[skillId])
          pointSettings[skillId] = { base: 0, multiplier: 0 };
        pointSettings[skillId][field] = parseFloat(value) || 0;
        renderAll();
      }

      function resort(key) {
        if (currentSort.key === key)
          currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
        else {
          currentSort.key = key;
          currentSort.dir = 'desc';
        }
        renderCards();
      }

      function exportSettings() {
        const js = `/**\n * Mini Card Battle - Skill Points Configuration\n */\nexport const SKILL_POINTS = ${JSON.stringify(pointSettings, null, 4)};\n`;
        const blob = new Blob([js], { type: 'text/javascript' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'skill_points.js';
        a.click();
      }

      window.onload = init;
    </script>
  </body>
</html>
