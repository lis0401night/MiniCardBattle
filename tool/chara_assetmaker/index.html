<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャラアセット書き出しツール</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --panel-bg: #ffffff;
    --border: #d7d9de;
    --text: #202225;
    --muted: #6b7280;
    --accent: #3a6df0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171b;
      --panel-bg: #1f2126;
      --border: #34363c;
      --text: #e7e8ea;
      --muted: #9aa0aa;
      --accent: #6c93ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px 20px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 12px; }
  h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  h2 small { color: var(--muted); font-weight: 400; }

  .upload-bar {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 180px; }
  .field label { font-size: 12px; color: var(--muted); }
  .field input[type="text"] { padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text); }
  .format-options { display: flex; gap: 12px; align-items: center; font-size: 13px; }
  .hint { font-size: 11px; color: var(--muted); margin: 2px 0 0; line-height: 1.4; }

  .settings-panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    margin-bottom: 20px;
  }
  .settings-panel summary { cursor: pointer; font-size: 13px; font-weight: 600; padding: 4px 0; }
  .settings-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 12px 0 4px;
  }
  .settings-grid .field { min-width: 140px; }
  .settings-grid select,
  .settings-grid input[type="number"] {
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
  }
  .settings-panel .hint { margin-top: 8px; }

  main.grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 16px;
  }
  @media (max-width: 640px) {
    main.grid { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .canvas-wrap {
    display: flex;
    justify-content: center;
    background:
      linear-gradient(45deg, #cfd2d8 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, #cfd2d8 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #cfd2d8 75%) 0 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #cfd2d8 75%) 0 0/16px 16px,
      #e8e9ec;
    border-radius: 6px;
    overflow: hidden;
    touch-action: none;
  }
  .panel canvas { cursor: grab; max-width: 100%; height: auto; display: block; }
  .panel canvas:active { cursor: grabbing; }

  .controls { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .controls input[type="range"] { flex: 1; min-width: 80px; }
  button {
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  .download-btn { background: var(--accent); color: #fff; border-color: var(--accent); }
  .link-row { margin-top: 8px; font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--muted); }

  footer { margin-top: 24px; text-align: center; }
  footer button { font-size: 14px; padding: 10px 22px; }
</style>
</head>
<body>

<h1>キャラアセット書き出しツール</h1>

<div class="upload-bar">
  <div class="field">
    <label>通常表情画像（Image A）</label>
    <input type="file" id="fileA" accept="image/*">
  </div>
  <div class="field">
    <label>ダメージ表情画像（Image B）</label>
    <input type="file" id="fileB" accept="image/*">
    <span class="hint">アイコンのダメージ差分にのみ使用されます</span>
  </div>
  <div class="field">
    <label>出力名（◯◯◯部分）</label>
    <input type="text" id="nameInput" value="dragon" placeholder="例: dragon">
  </div>
  <div class="field">
    <label>書き出し形式</label>
    <div class="format-options">
      <label><input type="radio" name="format" value="webp" checked> WebP</label>
      <label><input type="radio" name="format" value="png"> PNG</label>
    </div>
  </div>
</div>

<details class="settings-panel">
  <summary>書き出しリサイズ設定（pica）</summary>
  <div class="settings-grid">
    <div class="field">
      <label>quality（0〜3・大きいほど高品質）</label>
      <select id="opt-quality">
        <option value="0">0（最速・粗い）</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3（最高品質）</option>
      </select>
    </div>
    <div class="field">
      <label>filter（補間カーネル）</label>
      <select id="opt-filter">
        <option value="box">box</option>
        <option value="hamming">hamming</option>
        <option value="lanczos2">lanczos2</option>
        <option value="lanczos3">lanczos3</option>
        <option value="mks2013">mks2013</option>
      </select>
    </div>
    <div class="field">
      <label>unsharpAmount（0〜500）</label>
      <input type="number" id="opt-unsharpAmount" min="0" max="500" step="1">
    </div>
    <div class="field">
      <label>unsharpRadius（0.5〜2.0）</label>
      <input type="number" id="opt-unsharpRadius" min="0.5" max="2" step="0.1">
    </div>
    <div class="field">
      <label>unsharpThreshold（0〜255）</label>
      <input type="number" id="opt-unsharpThreshold" min="0" max="255" step="1">
    </div>
    <div class="field">
      <label>&nbsp;</label>
      <button type="button" id="opt-reset">初期値に戻す</button>
    </div>
  </div>
  <p class="hint">unsharpAmountを上げるとシャープになりますが、上げすぎるとなめらかなグラデーション部分に段差(バンディング)が出ることがあります。unsharpThresholdを2〜5程度にすると軽減できます。設定はブラウザに保存され、次回も引き継がれます。</p>
</details>

<main class="grid">

  <section class="panel" data-layer="char">
    <h2>char_<span class="name-preview"></span>.<span class="ext-preview"></span> <small>(800×1200)</small></h2>
    <div class="canvas-wrap"><canvas width="800" height="1200"></canvas></div>
    <div class="controls">
      <input type="range" class="zoom-slider" min="0" max="1" step="0.001" value="0">
      <button class="reset-btn" type="button">リセット</button>
      <button class="download-btn" type="button">ダウンロード</button>
    </div>
  </section>

  <section class="panel" data-layer="board">
    <h2>board_<span class="name-preview"></span>.<span class="ext-preview"></span> <small>(400×200)</small></h2>
    <div class="canvas-wrap"><canvas width="400" height="200"></canvas></div>
    <div class="controls">
      <input type="range" class="zoom-slider" min="0" max="1" step="0.001" value="0">
      <button class="reset-btn" type="button">リセット</button>
      <button class="download-btn" type="button">ダウンロード</button>
    </div>
  </section>

  <section class="panel" data-layer="icon">
    <h2>icon_<span class="name-preview"></span>.<span class="ext-preview"></span> <small>(200×200・円形)</small></h2>
    <div class="canvas-wrap"><canvas width="200" height="200"></canvas></div>
    <div class="controls">
      <input type="range" class="zoom-slider" min="0" max="1" step="0.001" value="0">
      <button class="reset-btn" type="button">リセット</button>
      <button class="download-btn" type="button">ダウンロード</button>
    </div>
  </section>

  <section class="panel" data-layer="iconDamage">
    <h2>icon_<span class="name-preview"></span>_damage.<span class="ext-preview"></span> <small>(200×200・円形)</small></h2>
    <div class="canvas-wrap"><canvas width="200" height="200"></canvas></div>
    <div class="controls">
      <input type="range" class="zoom-slider" min="0" max="1" step="0.001" value="0">
      <button class="reset-btn" type="button">リセット</button>
      <button class="download-btn" type="button">ダウンロード</button>
    </div>
    <div class="link-row">
      <label><input type="checkbox" class="link-checkbox" checked> 通常アイコンの位置・サイズにリンク</label>
    </div>
  </section>

</main>

<footer>
  <button id="downloadAllBtn" type="button">4ファイルをまとめてダウンロード</button>
</footer>

<script src="vendor/pica.min.js"></script>
<script>
(() => {
  "use strict";

  // High-quality (Lanczos) export resize, via the vendored pica library.
  const picaInstance = pica();

  const PICA_OPTIONS_KEY = 'chara_assetmaker.picaOptions';
  const PICA_DEFAULTS = { quality: 3, filter: 'lanczos3', unsharpAmount: 0, unsharpRadius: 0.5, unsharpThreshold: 0 };

  function loadPicaOptions() {
    try {
      const raw = localStorage.getItem(PICA_OPTIONS_KEY);
      if (!raw) return { ...PICA_DEFAULTS };
      return { ...PICA_DEFAULTS, ...JSON.parse(raw) };
    } catch {
      return { ...PICA_DEFAULTS };
    }
  }

  const picaOptions = loadPicaOptions();

  function savePicaOptions() {
    localStorage.setItem(PICA_OPTIONS_KEY, JSON.stringify(picaOptions));
  }

  const TARGET_SPECS = {
    char:       { w: 800, h: 1200, circular: false, sourceOf: 'A' },
    board:      { w: 400, h: 200, circular: false, sourceOf: 'A' },
    icon:       { w: 200, h: 200, circular: true,  sourceOf: 'A' },
    iconDamage: { w: 200, h: 200, circular: true,  sourceOf: 'B' },
  };
  // Measured from sample/icon_dragon.webp via alpha-channel scan:
  // opaque circle spans px 4..194 of a 200px canvas (diameter 191, ratio 0.955), centered.
  const ICON_CIRCLE = { diameterRatio: 0.955, centerXRatio: 0.5, centerYRatio: 0.5 };
  const MAX_ZOOM_MULTIPLIER = 8;
  const DEFAULT_ANCHOR_Y = 0.30;

  const state = {
    images: { A: null, B: null },
  };

  const layers = {};

  function initLayers() {
    for (const id of Object.keys(TARGET_SPECS)) {
      const spec = TARGET_SPECS[id];
      const panel = document.querySelector(`.panel[data-layer="${id}"]`);
      const canvas = panel.querySelector('canvas');
      layers[id] = {
        id,
        w: spec.w, h: spec.h, circular: spec.circular, sourceOf: spec.sourceOf,
        panel, canvas, ctx: canvas.getContext('2d'),
        slider: panel.querySelector('.zoom-slider'),
        sourceImage: null,
        transform: { scale: 1, offsetX: 0, offsetY: 0 },
        minScale: 1, maxScale: 1,
        isLinked: id === 'iconDamage' ? true : undefined,
      };
    }
  }

  function computeCoverRect(layer) {
    if (!layer.circular) {
      return { x0: 0, y0: 0, x1: layer.w, y1: layer.h, w: layer.w, h: layer.h };
    }
    const r = layer.w * ICON_CIRCLE.diameterRatio / 2;
    const cx = layer.w * ICON_CIRCLE.centerXRatio;
    const cy = layer.h * ICON_CIRCLE.centerYRatio;
    return { x0: cx - r, y0: cy - r, x1: cx + r, y1: cy + r, w: r * 2, h: r * 2 };
  }

  function computeInitialTransform(sw, sh, coverRect, anchorYRatio) {
    const scale = Math.max(coverRect.w / sw, coverRect.h / sh);
    const scaledW = sw * scale, scaledH = sh * scale;
    const offsetX = coverRect.x0 + (coverRect.w - scaledW) / 2;
    let offsetY = coverRect.y0 + coverRect.h / 2 - anchorYRatio * sh * scale;
    const minOffsetY = coverRect.y1 - scaledH;
    const maxOffsetY = coverRect.y0;
    offsetY = Math.min(maxOffsetY, Math.max(minOffsetY, offsetY));
    return { scale, offsetX, offsetY };
  }

  function computeMinMaxScale(layer) {
    if (!layer.sourceImage) return;
    const coverRect = computeCoverRect(layer);
    const sw = layer.sourceImage.naturalWidth, sh = layer.sourceImage.naturalHeight;
    const minScale = Math.max(coverRect.w / sw, coverRect.h / sh);
    layer.minScale = minScale;
    layer.maxScale = minScale * MAX_ZOOM_MULTIPLIER;
  }

  function clampTransform(layer) {
    if (!layer.sourceImage) return;
    const coverRect = computeCoverRect(layer);
    const sw = layer.sourceImage.naturalWidth, sh = layer.sourceImage.naturalHeight;
    let { scale, offsetX, offsetY } = layer.transform;
    scale = Math.min(layer.maxScale, Math.max(layer.minScale, scale));
    offsetX = Math.min(coverRect.x0, Math.max(coverRect.x1 - sw * scale, offsetX));
    offsetY = Math.min(coverRect.y0, Math.max(coverRect.y1 - sh * scale, offsetY));
    layer.transform = { scale, offsetX, offsetY };
  }

  function currentAnchorYFor(layer) {
    return layer.id === 'char' ? 0.5 : DEFAULT_ANCHOR_Y;
  }

  function resetLayerTransform(layer) {
    if (!layer.sourceImage) return;
    computeMinMaxScale(layer);
    const coverRect = computeCoverRect(layer);
    const sw = layer.sourceImage.naturalWidth, sh = layer.sourceImage.naturalHeight;
    const t = computeInitialTransform(sw, sh, coverRect, currentAnchorYFor(layer));
    layer.transform = t;
    clampTransform(layer);
    updateSliderFromScale(layer);
    render(layer);
    if (layer.id === 'icon') syncIconDamageIfLinked();
  }

  function syncIconDamageIfLinked() {
    const icon = layers.icon, dmg = layers.iconDamage;
    if (!dmg.isLinked || !dmg.sourceImage || !icon.sourceImage) return;
    computeMinMaxScale(dmg);
    dmg.transform = { ...icon.transform };
    clampTransform(dmg);
    updateSliderFromScale(dmg);
    render(dmg);
  }

  function render(layer) {
    const ctx = layer.ctx;
    ctx.clearRect(0, 0, layer.w, layer.h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if (layer.circular) {
      ctx.save();
      ctx.beginPath();
      const r = layer.w * ICON_CIRCLE.diameterRatio / 2;
      ctx.arc(layer.w * ICON_CIRCLE.centerXRatio, layer.h * ICON_CIRCLE.centerYRatio, r, 0, Math.PI * 2);
      ctx.clip();
    }
    if (layer.sourceImage) {
      const { scale, offsetX, offsetY } = layer.transform;
      ctx.drawImage(
        layer.sourceImage, offsetX, offsetY,
        layer.sourceImage.naturalWidth * scale, layer.sourceImage.naturalHeight * scale
      );
    } else {
      ctx.fillStyle = '#cdd0d6';
      ctx.fillRect(0, 0, layer.w, layer.h);
      ctx.fillStyle = '#767b85';
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('画像未アップロード', layer.w / 2, layer.h / 2);
    }
    if (layer.circular) ctx.restore();
  }

  function updateSliderFromScale(layer) {
    if (!(layer.maxScale > layer.minScale)) { layer.slider.value = 0; return; }
    const ratio = layer.transform.scale / layer.minScale;
    const value = Math.log(ratio) / Math.log(MAX_ZOOM_MULTIPLIER);
    layer.slider.value = Math.min(1, Math.max(0, value));
  }

  function toCanvasCoords(canvas, clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height),
    };
  }

  function setScaleAround(layer, px, py, newScaleRaw) {
    const { scale, offsetX, offsetY } = layer.transform;
    const srcX = (px - offsetX) / scale;
    const srcY = (py - offsetY) / scale;
    const newScale = Math.min(layer.maxScale, Math.max(layer.minScale, newScaleRaw));
    layer.transform = {
      scale: newScale,
      offsetX: px - srcX * newScale,
      offsetY: py - srcY * newScale,
    };
    clampTransform(layer);
    updateSliderFromScale(layer);
    render(layer);
  }

  function attachPanZoom(layer) {
    const canvas = layer.canvas;
    let dragStart = null;

    canvas.addEventListener('pointerdown', (e) => {
      if (!layer.sourceImage) return;
      canvas.setPointerCapture(e.pointerId);
      const p = toCanvasCoords(canvas, e.clientX, e.clientY);
      dragStart = { x: p.x, y: p.y, offsetX: layer.transform.offsetX, offsetY: layer.transform.offsetY };
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!dragStart) return;
      const p = toCanvasCoords(canvas, e.clientX, e.clientY);
      layer.transform.offsetX = dragStart.offsetX + (p.x - dragStart.x);
      layer.transform.offsetY = dragStart.offsetY + (p.y - dragStart.y);
      clampTransform(layer);
      render(layer);
      if (layer.id === 'icon') syncIconDamageIfLinked();
    });
    const endDrag = () => { dragStart = null; };
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    canvas.addEventListener('wheel', (e) => {
      if (!layer.sourceImage) return;
      e.preventDefault();
      const p = toCanvasCoords(canvas, e.clientX, e.clientY);
      setScaleAround(layer, p.x, p.y, layer.transform.scale * Math.pow(1.0015, -e.deltaY));
      if (layer.id === 'icon') syncIconDamageIfLinked();
    }, { passive: false });

    layer.slider.addEventListener('input', () => {
      if (!layer.sourceImage) return;
      const value = parseFloat(layer.slider.value);
      const newScale = layer.minScale * Math.pow(MAX_ZOOM_MULTIPLIER, value);
      const coverRect = computeCoverRect(layer);
      const cx = (coverRect.x0 + coverRect.x1) / 2;
      const cy = (coverRect.y0 + coverRect.y1) / 2;
      setScaleAround(layer, cx, cy, newScale);
      if (layer.id === 'icon') syncIconDamageIfLinked();
    });

    layer.panel.querySelector('.reset-btn').addEventListener('click', () => {
      if (layer.id === 'iconDamage' && layer.isLinked) {
        syncIconDamageIfLinked();
      } else {
        resetLayerTransform(layer);
      }
    });

    layer.panel.querySelector('.download-btn').addEventListener('click', () => exportLayer(layer));
  }

  function assignSourceToLayers(slot, img) {
    for (const id of Object.keys(layers)) {
      if (layers[id].sourceOf === slot) layers[id].sourceImage = img;
    }
    if (slot === 'A') {
      resetLayerTransform(layers.char);
      resetLayerTransform(layers.board);
      resetLayerTransform(layers.icon); // triggers syncIconDamageIfLinked internally
    } else {
      const dmg = layers.iconDamage;
      computeMinMaxScale(dmg);
      if (dmg.isLinked && layers.icon.sourceImage) {
        syncIconDamageIfLinked();
      } else {
        resetLayerTransform(dmg);
      }
    }
  }

  function handleUpload(slot, file) {
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      state.images[slot] = img;
      assignSourceToLayers(slot, img);
      URL.revokeObjectURL(url);
    };
    img.onerror = () => {
      alert('画像の読み込みに失敗しました。別のファイルをお試しください。');
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  // ---- filenames / export ----

  // Resizes the whole source image to exactly targetW x targetH using pica's
  // Lanczos resampler (vendor/pica.min.js) for proper alias-free, non-blurry
  // downscaling even at large ratios (e.g. big source photo -> 200px icon).
  async function resizeSourceToSize(img, targetW, targetH) {
    const out = document.createElement('canvas');
    out.width = targetW;
    out.height = targetH;
    await picaInstance.resize(img, out, {
      quality: picaOptions.quality,
      filter: picaOptions.filter,
      unsharpAmount: picaOptions.unsharpAmount,
      unsharpRadius: picaOptions.unsharpRadius,
      unsharpThreshold: picaOptions.unsharpThreshold,
    });
    return out;
  }

  async function renderForExport(layer) {
    const ctx = layer.ctx;
    ctx.clearRect(0, 0, layer.w, layer.h);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const img = layer.sourceImage;
    const { scale, offsetX, offsetY } = layer.transform;
    const targetW = Math.max(1, Math.round(img.naturalWidth * scale));
    const targetH = Math.max(1, Math.round(img.naturalHeight * scale));
    const resized = await resizeSourceToSize(img, targetW, targetH);

    if (layer.circular) {
      ctx.save();
      ctx.beginPath();
      const r = layer.w * ICON_CIRCLE.diameterRatio / 2;
      ctx.arc(layer.w * ICON_CIRCLE.centerXRatio, layer.h * ICON_CIRCLE.centerYRatio, r, 0, Math.PI * 2);
      ctx.clip();
    }
    ctx.drawImage(resized, offsetX, offsetY);
    if (layer.circular) ctx.restore();
  }

  function currentFormat() {
    return document.querySelector('input[name="format"]:checked').value;
  }

  function getFilename(layer, ext) {
    const slug = (document.getElementById('nameInput').value.trim() || 'output');
    const map = {
      char: `char_${slug}`,
      board: `board_${slug}`,
      icon: `icon_${slug}`,
      iconDamage: `icon_${slug}_damage`,
    };
    return `${map[layer.id]}.${ext}`;
  }

  async function exportLayer(layer) {
    if (!layer.sourceImage) {
      alert(`${layer.id}: 画像が未アップロードのため書き出せません`);
      return;
    }
    await renderForExport(layer);
    const format = currentFormat();
    const mime = format === 'png' ? 'image/png' : 'image/webp';
    const blob = await new Promise((resolve) => layer.canvas.toBlob(resolve, mime, format === 'webp' ? 0.92 : undefined));
    render(layer);
    if (!blob) {
      alert('書き出しに失敗しました。ブラウザがこの形式に対応していない可能性があります。');
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = getFilename(layer, format);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function exportAll() {
    for (const id of ['char', 'board', 'icon', 'iconDamage']) {
      await exportLayer(layers[id]);
      await new Promise((r) => setTimeout(r, 150));
    }
  }

  function updatePreviewLabels() {
    const slug = document.getElementById('nameInput').value.trim() || 'output';
    const ext = currentFormat();
    document.querySelectorAll('.name-preview').forEach((el) => { el.textContent = slug; });
    document.querySelectorAll('.ext-preview').forEach((el) => { el.textContent = ext; });
  }

  // ---- pica settings panel ----

  const PICA_OPTION_FIELDS = [
    { id: 'opt-quality', key: 'quality', numeric: true },
    { id: 'opt-filter', key: 'filter', numeric: false },
    { id: 'opt-unsharpAmount', key: 'unsharpAmount', numeric: true },
    { id: 'opt-unsharpRadius', key: 'unsharpRadius', numeric: true },
    { id: 'opt-unsharpThreshold', key: 'unsharpThreshold', numeric: true },
  ];

  function applyPicaOptionsToUI() {
    for (const { id, key } of PICA_OPTION_FIELDS) {
      document.getElementById(id).value = picaOptions[key];
    }
  }

  function wireSettingsPanel() {
    applyPicaOptionsToUI();
    for (const { id, key, numeric } of PICA_OPTION_FIELDS) {
      document.getElementById(id).addEventListener('change', (e) => {
        picaOptions[key] = numeric ? parseFloat(e.target.value) : e.target.value;
        savePicaOptions();
      });
    }
    document.getElementById('opt-reset').addEventListener('click', () => {
      Object.assign(picaOptions, PICA_DEFAULTS);
      savePicaOptions();
      applyPicaOptionsToUI();
    });
  }

  // ---- wiring ----

  function main() {
    wireSettingsPanel();
    initLayers();
    Object.values(layers).forEach((layer) => {
      attachPanZoom(layer);
      render(layer);
    });

    document.getElementById('fileA').addEventListener('change', (e) => handleUpload('A', e.target.files[0]));
    document.getElementById('fileB').addEventListener('change', (e) => handleUpload('B', e.target.files[0]));
    document.getElementById('nameInput').addEventListener('input', updatePreviewLabels);
    document.querySelectorAll('input[name="format"]').forEach((r) => r.addEventListener('change', updatePreviewLabels));
    document.getElementById('downloadAllBtn').addEventListener('click', exportAll);

    document.querySelector('.link-checkbox').addEventListener('change', (e) => {
      layers.iconDamage.isLinked = e.target.checked;
      if (e.target.checked) syncIconDamageIfLinked();
    });

    updatePreviewLabels();
  }

  document.addEventListener('DOMContentLoaded', main);
})();
</script>
</body>
</html>
