    <meta charset="UTF-8" />
    <title>Card Sheet Tool</title>
    <style>
      body {
        background-color: #000;
        color: #fff;
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: sans-serif;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* body自体はスクロールさせない */
      }

      /* 画面上部のヘッダ領域 */
      #header {
        background: #111;
        padding: 15px 40px;
        border-bottom: 1px solid #333;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        flex-shrink: 0;
      }

      select {
        background: #222;
        color: #fff;
        border: 1px solid #555;
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 14px;
        margin-left: 10px;
      }

      /* スクロール可能なカード表示領域 */
      #scroll-area {
        flex: 1;
        overflow: auto;
        padding: 40px;
      }

      #sheet {
        display: grid;
        gap: 6px;
        width: max-content; /* 中身のサイズに合わせて広がるように */
        /* 行と列はJSで動的に設定されます */
      }

      .card-container {
        width: 100%;
        height: 100%;
        /* 角丸とグレーのグラデーションフチ線 */
        border-radius: 8px;
        background: linear-gradient(135deg, #777777 0%, #222222 100%);
        padding: 2px; /* フチの太さ */
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 実際のカードらしい角丸トリミング */
        border-radius: 6px;
        background-color: #111;
        display: block;
      }
    </style>
    <script
      type="module"
      src="../src/tools/common/toolNavStandalone.js"
    ></script>
  </head>

      // カード1枚の表示幅(px) (以前の60%程度のサイズ = 120px)

      // カードの縦横比率 (横2:縦3)
      const cardAspectRatio = '2 / 3';

      // ==========================================
      // 処理エリア
      // ==========================================
      const selectEl = document.getElementById('leaderSelect');
      const sheetEl = document.getElementById('sheet');

      function initSelect() {
        for (const leader in exclusiveCards) {
          const option = document.createElement('option');
          option.value = leader;
          option.textContent = leader;
          selectEl.appendChild(option);
        }

        selectEl.addEventListener('change', () => {
          renderCards(selectEl.value);
        });

        // 初期表示はアイギス
        selectEl.value = 'android';
        renderCards('android');
      }

      function renderCards(leader) {
        sheetEl.innerHTML = '';
        const cardIds = exclusiveCards[leader] || [];

        // 横の枚数を自動計算 (枚数を縦の枚数で割って切り上げ)
        const gridCols = Math.ceil(cardIds.length / gridRows) || 5;

        // CSS Grid の設定
        sheetEl.style.gridTemplateColumns = `repeat(${gridCols}, ${cardWidth}px)`;
        sheetEl.style.gridTemplateRows = `repeat(${gridRows}, auto)`;

        // カード画像を配置
        cardIds.forEach((id) => {
          const container = document.createElement('div');
          container.className = 'card-container';
          container.style.aspectRatio = cardAspectRatio;

          const img = document.createElement('img');
          img.className = 'card';
          img.alt = id;

          // 画像パス指定
          img.src = `/assets/cards/card_${id}.webp`;

          // フォールバック
          img.onerror = function () {
            if (this.src.endsWith('.webp') && !this.src.includes('_premium')) {
              this.src = `/assets/cards/card_${id}_premium.webp`;
            }
          };

          container.appendChild(img);
          sheetEl.appendChild(container);
        });
      }

      // 実行
      initSelect();
