<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Data Viewer - 全プレイヤーデータ閲覧</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .scroll-custom::-webkit-scrollbar {
        width: 6px;
      }

      .scroll-custom::-webkit-scrollbar-track {
        background: transparent;
      }

      .scroll-custom::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }

      .scroll-custom::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* メインコンテナ：左右分割レイアウト */
      .main-container {
        display: flex;
        gap: 1.5rem;
        height: calc(100vh - 140px);
        min-height: 500px;
      }

      .panel-scroll {
        flex: 1;
        height: 100%;
        overflow-y: auto;
      }

      /* ローディングアニメーション */
      .loading-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* プレイヤーアイコン */
      .player-icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid #6366f1;
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
      }

      .player-icon-large {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #6366f1;
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
      }

      /* デッキカードのグリッド */
      .deck-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 0.5rem;
      }

      /* ポイントバー */
      .point-bar {
        height: 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #a78bfa);
        transition: width 0.5s ease;
      }

      /* 選択中のプレイヤー行のハイライト */
      .player-row-selected {
        background-color: rgba(99, 102, 241, 0.15) !important;
        border-left: 3px solid #6366f1;
      }

      @media (max-width: 1024px) {
        .main-container {
          flex-direction: column;
          height: auto;
        }

        .panel-scroll {
          height: auto;
          max-height: 600px;
          overflow-y: auto;
        }

        .player-icon-large {
          width: 80px;
          height: 80px;
        }
      }
    </style>
    <script
      type="module"
      src="../src/tools/common/toolNavStandalone.js"
    ></script>
  </head>

  <body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
    <!-- ナビゲーションバー -->
    <nav
      class="bg-slate-900 text-white p-4 shrink-0 shadow-xl z-50 sticky top-0"
    >
      <div
        class="max-w-[1600px] mx-auto flex flex-col md:flex-row justify-between items-center px-2 md:px-4 gap-4"
      >
        <div class="flex items-center gap-3">
          <div class="bg-indigo-600 p-2 rounded-lg">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="w-6 h-6"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"
              />
            </svg>
          </div>
          <h1
            class="font-black tracking-tighter text-xl uppercase italic text-white"
          >
            Player:Data
            <span
              class="text-[10px] not-italic font-normal text-slate-500 ml-1 tracking-normal"
              >v1.0 プレイヤーデータビューア</span
            >
          </h1>
        </div>

        <div class="flex flex-wrap justify-center gap-2 md:gap-4 items-center">
          <!-- 検索フィルター -->
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="search-input"
              placeholder="名前で検索..."
              class="bg-white/10 text-white px-3 py-2 rounded-xl text-xs font-bold border border-white/10 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all w-40"
            />
          </div>
          <div class="flex bg-slate-800 rounded-lg p-1 gap-1 ml-2">
            <button
              id="tab-players"
              class="px-3 py-1.5 rounded-md text-xs font-bold bg-indigo-600 text-white transition-colors"
              onclick="window.switchTab('players')"
            >
              プレイヤー一覧
            </button>
            <button
              id="tab-cards"
              class="px-3 py-1.5 rounded-md text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-700 transition-colors"
              onclick="window.switchTab('cards')"
            >
              全カード一覧
            </button>
          </div>
          <div class="hidden md:block h-8 w-px bg-slate-700 mx-2"></div>
          <div
            id="player-count"
            class="text-[10px] font-black text-indigo-400 bg-indigo-950 px-3 py-1 rounded-full border border-indigo-800"
          >
            読込中...
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-1 p-2 md:p-4 w-full">
      <!-- ローディング -->
      <div
        id="loading-overlay"
        class="h-[60vh] flex flex-col items-center justify-center space-y-4"
      >
        <div
          class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"
        ></div>
        <div
          class="font-black text-slate-400 uppercase tracking-[0.3em] text-sm loading-pulse"
        >
          プレイヤーデータを取得中...
        </div>
      </div>

      <!-- メインビュー -->
      <div id="view-main" class="main-container max-w-[1600px] mx-auto hidden">
        <!-- 左: プレイヤー一覧テーブル -->
        <div
          class="flex-[3] flex flex-col bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden w-full overflow-x-auto"
        >
          <div
            class="p-4 md:p-5 border-b bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2 min-w-[600px]"
          >
            <div>
              <h2
                class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1"
              >
                データベース
              </h2>
              <div class="flex items-center gap-3">
                <div class="text-xl font-black text-slate-800 tracking-tight">
                  登録プレイヤー一覧
                </div>
                <div
                  id="filter-status-badge"
                  class="text-[10px] font-bold text-slate-600 bg-slate-200 px-2.5 py-0.5 rounded-full border border-slate-300"
                >
                  集計対象: --/--人
                </div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold text-slate-500"
                >集計フィルター:</span
              >
              <button
                onclick="window.toggleAllPlayers(true)"
                class="px-2.5 py-1 text-[11px] font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded-lg border border-emerald-300 transition-all shadow-sm flex items-center gap-1"
                title="すべてのプレイヤーを集計対象（有効）にする"
              >
                <span>✅ 全員有効</span>
              </button>
              <button
                onclick="window.toggleAllPlayers(false)"
                class="px-2.5 py-1 text-[11px] font-bold bg-rose-100 text-rose-700 hover:bg-rose-200 rounded-lg border border-rose-300 transition-all shadow-sm flex items-center gap-1"
                title="すべてのプレイヤーを集計対象外（除外）にする"
              >
                <span>❌ 全員除外</span>
              </button>
            </div>
          </div>

          <div class="panel-scroll scroll-custom min-w-[900px]">
            <table class="w-full text-left">
              <thead
                class="bg-white/95 backdrop-blur-sm text-[10px] font-black uppercase text-slate-400 tracking-widest border-b sticky top-0 z-20 shadow-sm"
              >
                <tr>
                  <th class="p-2 md:p-3 w-10 text-center">#</th>
                  <th class="p-2 md:p-3 text-center" style="min-width: 80px">
                    集計対象
                  </th>
                  <th class="p-2 md:p-3" style="min-width: 140px">
                    プレイヤー
                  </th>
                  <th class="p-2 md:p-3 text-center" style="min-width: 110px">
                    リーダー
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 80px"
                    onclick="window.sortBy('defense')"
                  >
                    防衛ポイント
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 60px"
                    onclick="window.sortBy('defense_wins')"
                  >
                    防衛成功数
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 80px"
                    onclick="window.sortBy('challenge')"
                  >
                    試練ポイント
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 80px"
                    onclick="window.sortBy('tournament')"
                  >
                    大会ポイント
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 80px"
                    onclick="window.sortBy('fortune')"
                  >
                    運命ポイント
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 70px"
                    onclick="window.sortBy('grade')"
                  >
                    等級（マキナ）
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 70px"
                    onclick="window.sortBy('grade_valkyria')"
                  >
                    等級（アンジェ）
                  </th>
                  <th class="p-2 md:p-3 text-center" style="min-width: 50px">
                    デッキ
                  </th>
                  <th
                    class="p-2 md:p-3 text-center cursor-pointer hover:text-indigo-500 transition-colors"
                    style="min-width: 100px"
                    onclick="window.sortBy('lastAccess')"
                  >
                    最終アクセス
                  </th>
                </tr>
              </thead>
              <tbody id="player-table-body" class="divide-y divide-slate-100">
                <!-- JS Injection -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- 右: プレイヤー詳細パネル -->
        <div
          class="flex-[1.8] flex flex-col bg-slate-900 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden min-w-full md:min-w-[400px] xl:max-w-2xl w-full"
        >
          <div
            class="p-4 md:p-5 border-b border-slate-800 bg-slate-900/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2"
          >
            <div>
              <h2
                class="text-xs font-black uppercase tracking-widest text-slate-500 mb-1"
              >
                詳細ビュー
              </h2>
              <div class="text-xl font-black text-white tracking-tight">
                プレイヤー情報
              </div>
            </div>
          </div>

          <div id="detail-panel" class="panel-scroll scroll-custom p-4 md:p-6">
            <!-- 未選択時のプレースホルダー -->
            <div
              id="detail-placeholder"
              class="h-full flex flex-col items-center justify-center text-center py-20"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-16 h-16 text-slate-700 mb-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
              <div
                class="text-sm font-black text-slate-600 uppercase tracking-widest"
              >
                プレイヤーを選択
              </div>
              <div class="text-xs text-slate-700 mt-1">
                左の一覧からプレイヤーをクリックしてください
              </div>
            </div>

            <!-- 選択時の詳細コンテンツ -->
            <div id="detail-content" class="hidden space-y-6">
              <!-- プロフィールセクション -->
              <div id="section-profile"></div>
              <!-- ポイントセクション -->
              <div id="section-points"></div>
              <!-- 所持アイテムセクション -->

              <!-- デッキセクション -->
              <div id="section-deck"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 全カード一覧ビュー -->
      <div
        id="view-cards"
        class="main-container max-w-[1600px] mx-auto hidden bg-white rounded-3xl shadow-sm border border-slate-200 flex-col overflow-hidden"
      >
        <div
          class="p-4 md:p-5 border-b bg-slate-50/50 flex flex-col md:flex-row justify-between items-start md:items-center gap-2"
        >
          <div>
            <h2
              class="text-xs font-black uppercase tracking-widest text-slate-400 mb-1"
            >
              データベース
            </h2>
            <div class="flex items-center gap-3">
              <div class="text-xl font-black text-slate-800 tracking-tight">
                全カード一覧
                <span
                  id="cards-count"
                  class="text-sm font-bold text-slate-500 ml-2"
                ></span>
              </div>
              <div
                id="cards-filter-status"
                class="text-[10px] font-bold text-indigo-700 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-200"
              >
                集計対象プレイヤー: --/--人
              </div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-500">並び替え:</span>
            <select
              id="card-sort-select"
              class="bg-white border border-slate-300 text-slate-700 text-xs font-bold rounded-lg px-2.5 py-1.5 outline-none focus:border-indigo-500 shadow-sm"
              onchange="window.sortCardList(this.value)"
            >
              <option value="defense">🛡️ 防衛デッキ使用順</option>
              <option value="attack">⚔️ 攻撃デッキ使用順</option>
              <option value="rarity">⭐ レアリティ順</option>
              <option value="id">📇 ID順</option>
            </select>
          </div>
        </div>
        <div class="panel-scroll scroll-custom p-4 md:p-6" id="cards-grid">
          <!-- JS Injection -->
        </div>
      </div>
    </main>

    <script type="module">
      // =============================
      // マスターデータ（init内でインポートを試行）
      // =============================
      let CARD_MASTER = [];
      let CHARACTERS = {};
      let PLAYMAT_MASTER = [];
      let ALL_ICONS = [];
      let SKILLS = {};

      // アセットパス補正ヘルパー（サーバーフルURLを含めて/assets/... へのローカル絶対パス変換）
      const fixAssetPath = (path) => {
        if (!path) return '';
        const isLocal =
          window.location.hostname === 'localhost' ||
          window.location.hostname === '127.0.0.1' ||
          window.location.hostname.startsWith('192.168.');

        if (isLocal) {
          const match = path.match(/assets\/(.+)$/i);
          if (match) {
            return `/assets/${match[1]}`;
          }
        }
        if (
          path.startsWith('http://') ||
          path.startsWith('https://') ||
          path.startsWith('/')
        ) {
          return path;
        }
        return '/' + path;
      };

      // アイコンパス生成ヘルパー
      const getIconPath = (id) => fixAssetPath(`assets/icons/icon_${id}.webp`);

      // =============================
      // 日本語名変換ヘルパー
      // =============================

      // スキンIDの日本語名マップ（characters.jsが読めない場合の静的フォールバック）
      const SKIN_NAME_MAP = {
        default: '通常',
        summer: '水着',
        school: '学園',
      };

      // ステージIDの日本語名マップ（stages.jsのnameに準拠）
      const STAGE_NAME_MAP = {
        plain: 'デフォルト',
        practice: '仮想空間',
        android: 'セクター7',
        dragon: '活火山',
        knight: '戦場',
        cthulhu: '狂気の深淵',
        elf: '迷いの森',
        cleric: '静寂の聖堂',
        devilhunter: '旧市街',
        witch: '魔女の隠れ家',
        oni: '逢魔が時',
        priest: '千年の王墓',
        satan: '魔王城',
        dungeon: '試練の宮殿',
        automata: '鋼の墓標',
      };

      /**
       * スキンIDを日本語名に変換する
       * キャラクターIDが指定されている場合、characters.jsのスキンデータを参照
       * @param {string} skinId - スキンID
       * @param {string} charId - キャラクターID（オプション）
       * @returns {string} 日本語名
       */
      function getSkinName(skinId, charId) {
        // characters.jsのスキンデータから名前を取得
        if (charId && CHARACTERS[charId]?.skins?.[skinId]?.name) {
          return CHARACTERS[charId].skins[skinId].name;
        }
        // 静的マップでフォールバック
        if (SKIN_NAME_MAP[skinId]) return SKIN_NAME_MAP[skinId];
        // 高難易度スキン（{charId}_high）の場合
        if (skinId.endsWith('_high')) {
          const baseChar = skinId.replace('_high', '');
          const charData = CHARACTERS[baseChar];
          if (charData?.skins?.[skinId]?.name)
            return charData.skins[skinId].name;
          return `高難易度 (${getCharName(baseChar)})`;
        }
        return skinId;
      }

      /**
       * プレイマットIDを日本語名に変換する
       * @param {string} pmId - プレイマットID
       * @returns {string} 日本語名
       */
      function getPlaymatName(pmId) {
        if (!pmId) return 'なし';
        const pm = PLAYMAT_MASTER.find((p) => p.id === pmId);
        if (pm) return pm.name;
        // PLAYMAT_MASTERが空（インポート失敗）の場合、ステージ名マップで代用
        return STAGE_NAME_MAP[pmId] || pmId;
      }

      /**
       * アイコンIDを日本語名に変換する
       * @param {string} iconId - アイコンID
       * @returns {string} 日本語名
       */
      function getIconName(iconId) {
        const icon = ALL_ICONS.find((i) => i.id === iconId);
        if (icon) return icon.name;
        // フォールバック: キャラクター名またはそのままのID
        return STAGE_NAME_MAP[iconId] || iconId;
      }

      /**
       * キャラクターIDを日本語名に変換する
       * @param {string} charId - キャラクターID
       * @returns {string} 日本語名
       */
      function getCharName(charId) {
        return (
          CHARACTERS[charId]?.name || STAGE_NAME_MAP[charId] || charId || '不明'
        );
      }

      /**
       * デッキのカードエントリからカードIDを取得する
       * デッキはオブジェクト配列({id, isPremium})または文字列配列のどちらも対応
       * @param {string|Object} entry - デッキエントリ
       * @returns {string} カードID
       */
      function resolveCardId(entry) {
        if (typeof entry === 'string') return entry;
        if (entry && typeof entry === 'object' && entry.id) return entry.id;
        return String(entry);
      }

      // =============================
      // 状態管理
      // =============================
      let allPlayers = [];
      let filteredPlayers = [];
      let selectedPlayerId = null;
      let currentSort = { key: 'defense', dir: 'desc' };
      let currentCardSort = 'defense';
      let currentTab = 'players';
      let excludedPlayerIds = new Set(); // 集計から除外するプレイヤーのUUID集合

      /**
       * プレイヤーの集計対象（有効 / 除外）を切り替える
       * @param {string} uuid - プレイヤーUUID
       * @param {Event} [e] - イベントオブジェクト
       */
      function togglePlayerFilter(uuid, e) {
        if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
        if (excludedPlayerIds.has(uuid)) {
          excludedPlayerIds.delete(uuid);
        } else {
          excludedPlayerIds.add(uuid);
        }
        renderPlayerList();
        renderCardList();
      }

      /**
       * 全プレイヤーの一括有効/除外を切り替える
       * @param {boolean} enableAll - trueなら全員有効、falseなら全員除外
       */
      function toggleAllPlayers(enableAll) {
        if (enableAll) {
          excludedPlayerIds.clear();
        } else {
          allPlayers.forEach((p) => excludedPlayerIds.add(p.uuid));
        }
        renderPlayerList();
        renderCardList();
      }

      // グローバル公開
      window.sortBy = sortBy;
      window.selectPlayer = selectPlayer;
      window.switchTab = switchTab;
      window.togglePlayerFilter = togglePlayerFilter;
      window.toggleAllPlayers = toggleAllPlayers;
      window.sortCardList = function (sortKey) {
        currentCardSort = sortKey;
        renderCardList();
      };

      // =============================
      // 初期化
      // =============================
      async function init() {
        try {
          // マスターデータのインポート（本番サーバーにsrc/がない場合はフォールバック）
          try {
            const cardsModule = await import('../src/utils/constants/cards.js');
            CARD_MASTER = cardsModule.CARD_MASTER || [];
          } catch (e) {
            console.warn(
              'cards.js の読み込みに失敗。カード名は生IDで表示されます。',
              e
            );
          }
          try {
            const charactersModule =
              await import('../src/utils/constants/characters.js');
            CHARACTERS = charactersModule.CHARACTERS || {};
          } catch (e) {
            console.warn(
              'characters.js の読み込みに失敗。キャラクター名は生IDで表示されます。',
              e
            );
          }
          try {
            const playmatsModule =
              await import('../src/utils/constants/playmats.js');
            PLAYMAT_MASTER = playmatsModule.PLAYMAT_MASTER || [];
          } catch (e) {
            console.warn(
              'playmats.js の読み込みに失敗。プレイマット名は生IDで表示されます。',
              e
            );
          }
          try {
            const avatarsModule =
              await import('../src/utils/constants/avatars.js');
            ALL_ICONS = [
              ...(avatarsModule.AVAILABLE_ICONS || []),
              ...(avatarsModule.EXTRA_ICONS || []),
            ];
          } catch (e) {
            console.warn(
              'avatars.js の読み込みに失敗。アイコン名は生IDで表示されます。',
              e
            );
          }
          try {
            const skillsModule =
              await import('../src/utils/constants/skills.js');
            SKILLS = skillsModule.SKILLS || {};
          } catch (e) {
            console.warn(
              'skills.js の読み込みに失敗。スキル名はIDで表示されます。',
              e
            );
          }

          // プレイヤーデータをAPIから取得
          const response = await fetch(
            `api/get_all_players.php?t=${Date.now()}`
          );
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          const data = await response.json();
          if (!data.success) {
            throw new Error('APIレスポンスエラー');
          }
          allPlayers = data.players || [];
          filteredPlayers = [...allPlayers];

          document.getElementById('loading-overlay').classList.add('hidden');
          document.getElementById('view-main').classList.remove('hidden');
          document.getElementById('player-count').innerText =
            `${allPlayers.length} 人のプレイヤー`;

          renderPlayerList();
          setupSearch();
        } catch (err) {
          console.error('初期化失敗:', err);
          document.getElementById('loading-overlay').innerHTML =
            `<div class="text-red-500 font-bold bg-red-100 p-4 rounded-xl">データの読み込みに失敗しました。<br>サーバー経由でアクセスしてください。</div>
             <div class="text-xs text-slate-500 mt-2">${err.message}</div>`;
        }
      }

      // =============================
      // 検索フィルター
      // =============================
      function setupSearch() {
        const input = document.getElementById('search-input');
        input.addEventListener('input', () => {
          const query = input.value.trim().toLowerCase();
          if (!query) {
            filteredPlayers = [...allPlayers];
          } else {
            filteredPlayers = allPlayers.filter(
              (p) =>
                (p.name || '').toLowerCase().includes(query) ||
                (p.uuid || '').toLowerCase().includes(query)
            );
          }
          renderPlayerList();
        });
      }

      // =============================
      // ソート
      // =============================
      function sortBy(key) {
        if (currentSort.key === key) {
          currentSort.dir = currentSort.dir === 'desc' ? 'asc' : 'desc';
        } else {
          currentSort.key = key;
          currentSort.dir = 'desc';
        }
        renderPlayerList();
      }

      /**
       * ソートキーに対応するプレイヤーのポイント値を取得する
       * @param {Object} p - プレイヤーデータ
       * @param {string} key - ソートキー
       * @returns {number} ポイント値
       */
      function getSortValue(p, key) {
        const SORT_KEY_MAP = {
          defense: 'total_points',
          challenge: 'challenge_total_points',
          tournament: 'tournament_total_points',
          fortune: 'fortune_total_points',
          defense_wins: 'defense_wins',
          grade: 'fortune_max_total_cost',
          grade_valkyria: 'fortune_max_total_cost_valkyria',
          lastAccess: 'lastAccessAt',
        };
        return p[SORT_KEY_MAP[key]] || 0;
      }

      // =============================
      // デッキセクション
      // =============================
      function renderDeck(p) {
        if (
          !p.has_defense_deck ||
          !Array.isArray(p.deck) ||
          p.deck.length === 0
        ) {
          document.getElementById('section-deck').innerHTML = `
            <div class="bg-slate-800/50 rounded-xl p-6 border border-white/5 text-center">
              <div class="text-slate-600 text-sm font-bold">防衛デッキ未登録</div>
            </div>
          `;
          return;
        }

        const charData = CHARACTERS[p.character] || {};
        const charName = getCharName(p.character);
        const charIcon = charData.icon || getIconPath(p.character || 'player');

        // デッキのカード情報を解決（デッキはオブジェクト配列{id,isPremium}または文字列配列に対応）
        const deckCards = p.deck.map((entry) => {
          const cardId = resolveCardId(entry);
          const card = CARD_MASTER.find((c) => c.id === cardId);
          return card || { id: cardId, name: cardId, power: '?', rarity: 0 };
        });

        // 同じカードを枚数でグループ化
        const groupedDeck = [];
        deckCards.forEach((c) => {
          const existing = groupedDeck.find((g) => g.card.id === c.id);
          if (existing) {
            existing.count++;
          } else {
            groupedDeck.push({ card: c, count: 1 });
          }
        });

        // レアリティの色マップ
        const RARITY_COLORS = {
          1: 'slate',
          2: 'blue',
          3: 'purple',
          4: 'amber',
          5: 'red',
        };

        const RARITY_LABELS = {
          1: 'N',
          2: 'R',
          3: 'SR',
          4: 'UR',
          5: 'LR',
        };

        document.getElementById('section-deck').innerHTML = `
          <div class="space-y-3">
            <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest">防衛デッキ</div>

            <!-- リーダー情報 -->
            <div class="bg-slate-800/50 rounded-xl p-3 border border-white/5 flex items-center gap-3">
              <img src="${charIcon}" alt="leader" class="w-12 h-12 rounded-xl border-2 border-indigo-500 object-cover"
                   onerror="this.src='${getIconPath('player')}'"/>
              <div>
                <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-0.5">リーダー</div>
                <div class="text-sm font-black text-white">${escapeHtml(charName)}</div>
                <div class="text-[10px] text-slate-400">ステージ: <span class="text-indigo-400 font-bold">${escapeHtml(STAGE_NAME_MAP[p.stage] || p.stage || 'デフォルト')}</span></div>
                <div class="text-[10px] text-slate-400">プレイマット: <span class="text-sky-400 font-bold">${escapeHtml(getPlaymatName(p.playmat))}</span></div>
              </div>
            </div>

            <!-- デッキカード一覧（同名カードは枚数でまとめて表示） -->
            <div class="bg-slate-800/50 rounded-xl p-3 border border-white/5">
              <div class="flex justify-between items-center mb-2">
                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">カード (${deckCards.length}枚 / ${groupedDeck.length}種)</span>
              </div>
              <div class="space-y-1">
                ${groupedDeck
                  .map(({ card: c, count }) => {
                    const rarityColor = RARITY_COLORS[c.rarity] || 'slate';
                    const rarityLabel = RARITY_LABELS[c.rarity] || '?';
                    const countBadge =
                      count > 1
                        ? `<span class="text-[8px] font-black text-indigo-300 bg-indigo-950/50 px-1 rounded">×${count}</span>`
                        : '';
                    return `
                    <div class="flex justify-between items-center text-[10px] bg-slate-900/50 p-2 rounded-lg border border-slate-700/50 hover:border-indigo-500/30 transition-all">
                      <div class="flex items-center gap-2 truncate">
                        <span class="text-[8px] font-black text-${rarityColor}-400 bg-${rarityColor}-950/50 px-1.5 py-0.5 rounded border border-${rarityColor}-800/50">${rarityLabel}</span>
                        <span class="font-bold text-slate-300 truncate">${escapeHtml(c.name)}</span>
                        ${countBadge}
                      </div>
                      <span class="font-black text-indigo-400 ml-2 shrink-0">${c.power ?? '?'}</span>
                    </div>`;
                  })
                  .join('')}
              </div>
            </div>
          </div>
        `;
      }

      // =============================
      // 全カード一覧セクション
      // =============================
      function renderCardList() {
        const totalCount = allPlayers.length;
        const includedCount = totalCount - excludedPlayerIds.size;
        const cardsFilterStatus = document.getElementById(
          'cards-filter-status'
        );
        if (cardsFilterStatus) {
          cardsFilterStatus.innerHTML = `集計対象プレイヤー: <span class="font-black text-indigo-600">${includedCount}</span> / ${totalCount} 人${
            excludedPlayerIds.size > 0
              ? ` <span class="text-rose-500 font-bold">(${excludedPlayerIds.size}人除外中)</span>`
              : ''
          }`;
        }

        // トークンを除外
        const cards = CARD_MASTER.filter(
          (c) => !String(c.id).startsWith('token_')
        );

        // 使用回数を集計 (防衛デッキ & 攻撃デッキ)
        const defenseUsageCounts = {};
        const attackUsageCounts = {};

        // 1. 防衛デッキ使用数の集計
        allPlayers.forEach((p) => {
          if (excludedPlayerIds.has(p.uuid)) return;
          if (p.has_defense_deck && Array.isArray(p.deck)) {
            p.deck.forEach((entry) => {
              const cId = resolveCardId(entry);
              defenseUsageCounts[cId] = (defenseUsageCounts[cId] || 0) + 1;
            });
          }
        });

        // 2. 攻撃デッキ使用数の集計（同一プレイヤーの複数履歴がある場合、各デッキ内での最大枚数を採用）
        // 例: 履歴AにカードXが2枚、履歴BにカードXが3枚 → そのプレイヤーのカードXは3枚として集計
        const globalPlayerCardMaxCounts = {};

        allPlayers.forEach((p) => {
          // 除外指定されているプレイヤーはスキップ
          if (excludedPlayerIds.has(p.uuid)) return;

          if (Array.isArray(p.defense_history)) {
            p.defense_history.forEach((rec) => {
              // attackerUuid が存在しないデータはスキップ（100% UUIDのみで集計）
              if (!rec.attackerUuid) return;

              // 攻撃側プレイヤーUUIDが集計除外リストに含まれている場合はスキップ
              if (excludedPlayerIds.has(rec.attackerUuid)) return;

              const attackerUuid = rec.attackerUuid;

              if (Array.isArray(rec.attackerDeck)) {
                // このデッキ内でのカードごとの枚数を集計
                const deckCardCounts = {};
                rec.attackerDeck.forEach((entry) => {
                  const cId = resolveCardId(entry);
                  deckCardCounts[cId] = (deckCardCounts[cId] || 0) + 1;
                });

                // プレイヤーごとの最大枚数を更新（既存値より多ければ上書き）
                if (!globalPlayerCardMaxCounts[attackerUuid]) {
                  globalPlayerCardMaxCounts[attackerUuid] = {};
                }
                Object.keys(deckCardCounts).forEach((cId) => {
                  const currentMax =
                    globalPlayerCardMaxCounts[attackerUuid][cId] || 0;
                  globalPlayerCardMaxCounts[attackerUuid][cId] = Math.max(
                    currentMax,
                    deckCardCounts[cId]
                  );
                });
              }
            });
          }
        });

        // 全攻撃者ごとのカード最大枚数を全域集計に加算
        Object.values(globalPlayerCardMaxCounts).forEach((counts) => {
          Object.keys(counts).forEach((cId) => {
            attackUsageCounts[cId] =
              (attackUsageCounts[cId] || 0) + counts[cId];
          });
        });

        // ソート処理
        cards.sort((a, b) => {
          const defA = defenseUsageCounts[a.id] || 0;
          const defB = defenseUsageCounts[b.id] || 0;
          const atkA = attackUsageCounts[a.id] || 0;
          const atkB = attackUsageCounts[b.id] || 0;

          if (currentCardSort === 'attack') {
            if (atkA !== atkB) return atkB - atkA;
            if (defA !== defB) return defB - defA;
          } else if (currentCardSort === 'defense') {
            if (defA !== defB) return defB - defA;
            if (atkA !== atkB) return atkB - atkA;
          } else if (currentCardSort === 'rarity') {
            if (a.rarity !== b.rarity) return b.rarity - a.rarity;
          }

          // タイブレイカー: CARD_MASTER定義インデックス順
          const idxA = CARD_MASTER.findIndex((c) => c.id === a.id);
          const idxB = CARD_MASTER.findIndex((c) => c.id === b.id);
          return idxA - idxB;
        });

        document.getElementById('cards-count').innerText =
          `(${cards.length}種)`;

        const RARITY_COLORS = {
          1: 'slate',
          2: 'blue',
          3: 'purple',
          4: 'amber',
          5: 'red',
        };
        const RARITY_LABELS = { 1: 'N', 2: 'R', 3: 'SR', 4: 'UR', 5: 'LR' };

        const gridHtml = cards
          .map((c) => {
            const defCount = defenseUsageCounts[c.id] || 0;
            const atkCount = attackUsageCounts[c.id] || 0;
            const rarityColor = RARITY_COLORS[c.rarity] || 'slate';
            const rarityLabel = RARITY_LABELS[c.rarity] || '?';
            const isZero = defCount === 0 && atkCount === 0;

            const skillsHtml = (c.skills || [])
              .map((sk) => {
                const skillName = SKILLS[sk.id]?.name || sk.id;
                return `<div class="text-[10px] text-slate-500"><span class="font-bold text-slate-700">${escapeHtml(skillName)}</span>: ${sk.value}</div>`;
              })
              .join('');

            return `
            <div class="bg-white border ${isZero ? 'border-slate-200 opacity-60' : 'border-slate-300'} rounded-xl p-3 flex flex-col shadow-sm hover:shadow-md transition-shadow">
              <div class="flex gap-3 mb-3">
                <img src="/assets/cards/card_${c.id}_thumb.webp" class="w-16 h-16 object-cover rounded-lg border border-slate-200 bg-slate-50 shrink-0" alt="${escapeHtml(c.name)}" onerror="this.src='/assets/icons/icon_player.webp'" />
                <div class="flex flex-col flex-1 min-w-0">
                  <div class="flex justify-between items-start gap-1">
                    <div class="font-black text-slate-800 text-sm truncate" title="${escapeHtml(c.name)}">${escapeHtml(c.name)}</div>
                    <div class="text-xs font-black text-indigo-500 shrink-0">PWR ${c.power ?? '?'}</div>
                  </div>
                  <div class="mt-1">
                    <span class="text-[10px] font-black text-${rarityColor}-600 bg-${rarityColor}-50 px-1.5 py-0.5 rounded border border-${rarityColor}-200">${rarityLabel}</span>
                  </div>
                  <div class="mt-auto pt-1 text-[11px] font-bold space-y-0.5">
                    <div class="text-indigo-600">⚔️ 攻撃デッキ使用: ${atkCount}枚</div>
                    <div class="text-amber-600">🛡️ 防衛デッキ使用: ${defCount}枚</div>
                  </div>
                </div>
              </div>
              <div class="mt-auto bg-slate-50 rounded p-2 min-h-[44px]">
                ${skillsHtml || '<div class="text-[10px] text-slate-400 italic">スキルなし</div>'}
              </div>
            </div>
          `;
          })
          .join('');

        document.getElementById('cards-grid').innerHTML =
          `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4">${gridHtml}</div>`;
      }

      // =============================
      // ユーティリティ
      // =============================

      /**
       * HTML特殊文字をエスケープする
       * @param {string} str - エスケープ対象の文字列
       * @returns {string} エスケープ済み文字列
       */
      function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      /**
       * 数値を読みやすい形式にフォーマットする
       * @param {number} n - フォーマット対象の数値
       * @returns {string} カンマ区切りの文字列
       */
      function formatNumber(n) {
        return Number(n).toLocaleString('ja-JP');
      }

      // =============================
      // 起動
      // =============================
      init();
    </script>
  </body>
</html>
