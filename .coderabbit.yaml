# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ja'
reviews:
  profile: 'assertive'
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
  path_instructions:
    - path: '**/*'
      instructions: |
        プルリクエストをレビューする際は、以下のプロジェクト固有のコーディングルールおよび厳密な制約を遵守しているか、徹底して確認してください。違反がある場合は指摘（または改善の提案）を行ってください。

        ### 1. コーディングおよび実装の基本原則
        - **日本語の維持**: コードのコメントや、生成する各種ドキュメントはすべて日本語で記述すること。
        - **DOM処理の廃止**: DOMの直接操作は行わず、Reactの状態管理（State）に完全に処理を任せること。
        - **可読性の高いコメント**: ゲームのシステムに関わる処理には、人間が見て明確に理解できるコメントを記載すること。
        - **定数の徹底**: マジックナンバーを排除し、定数を利用すること。
        - **DRY原則**: 共通処理は適切にまとめ、コードの重複を排除してDRY原則を保つこと。
        - **データ整合性（最重要）**: LocalStorageのユーザーデータや、サーバー上のユーザーデータとの不整合は絶対に発生させないこと。ユーザーデータの損失や破損には極めて慎重に対応すること。

        ### 2. 「召喚（Summon）」と「配置（Place）」の厳密な区別（絶対厳守）
        カードを場に出す処理を実装する際、以下の2種類のアクションを「絶対に」混同せず、完全に分離して実装・レビューすること。

        1. **「召喚（Summon）」**
           - **該当するアクション**: 手札からのプレイ、試練の宮殿のリーダースキル、「号令」スキル
           - **制約チェック**: 【あり（有効）】
           - **挙動**: 「伝説（中央のみ）」「生贄（配置済みレーンのみ）」「挑戦（正面に敵がいるレーン）」などの、カードが持つ配置制約ルールに必ず従わなければならない。また、召喚時のアクティブスキルが発動する。
           - **コードの基準**: 配置先を選択させる `waitPlayerLaneSelection` 関数などを呼び出す際、 `checkConstraints`（制約チェック）フラグには必ず `true` を渡していること。また、発動可能なスキルがあれば解決処理（`resolveOnPlaySkill`など）を呼び出していること。

        2. **「配置（Place）」**
           - **該当するアクション**: 「復活」スキル、「マリアのリーダースキル」、「分身」、「召喚」、「造壁」などの特殊効果
           - **制約チェック**: 【なし（無視）】
           - **挙動**: 対象となるカードが「伝説」や「生贄」などの制約ルールを持っていたとしても、すべて完全に無視して好きなレーンに置くことができる。また、原則として召喚時のアクティブスキルは発動させないよう実装すること。
           - **コードの基準**: `waitPlayerLaneSelection` 関数などを呼び出す際、 `checkConstraints` フラグには必ず `false` を渡していること。

        ※ **最優先グローバルルール**:
        「封印（Seal）」されたレーンに関しては、上記1および2のどちらの手段（召喚・配置）であっても**強制的にブロックされ、カードを置くことができない**。この例外処理が正しく実装されていること。

        ### 3. 日本語スキル名の英語IDへの変換（絶対厳守）
        日本語の「スキル名」を、内部の英語IDに変換・解釈する際、絶対に推測や類似の単語で代用せず、コード上の正確な対応表（`src/utils/constants/skills.js`）に基づいて厳密に一致させているか確認すること。
        特に以下の取り違えはシステム破壊に直結する重大な違反であるため、厳格に指摘すること。
        - 「変身」 ＝ `metamorph`
        - 「変化」 ＝ `morph`
        - 「号令」 ＝ `call`
