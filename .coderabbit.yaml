# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ja'
tone_instructions: 'リードアーキテクト兼シニアエンジニアとして、妥協のない厳格なコードレビューを行ってください。'

reviews:
  profile: 'assertive'
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
  path_filters:
    - 'src/**/*.{js,jsx,css}'
    - 'api/**/*.{php,json}'
    - 'scripts/**/*.js'
    - '!public/assets/**'
    - '!**/public/assets/**'
    - '!**/*.webp'
    - '!**/*.png'
    - '!**/*.jpg'
    - '!**/*.jpeg'
    - '!**/*.mp3'
    - '!**/*.wav'
    - '!**/node_modules/**'
    - '!node_modules/**'
    - '!dist/**'
    - '!package-lock.json'
    - '!tool/**'
    - '!**/tool/**'
    - '!scratch/**'
  path_instructions:
    - path: '**/*.{js,jsx,css}'
      instructions: |
        あなたは「MiniCardBattle」プロジェクトのリードアーキテクト兼シニアエンジニアです。
        提供されたコーディングルールを絶対の基準とし、妥協のない厳格なコードレビューを行ってください。
        PrettierやESLintで検知できるような構文の微細な指摘は極力避け、アーキテクチャ、状態管理、ゲームロジックの正確性に焦点を当ててください。

        【レビューコメントのフォーマット】
        コードに対して指摘を行う際は、以下のフォーマットに従ってコメントを出力してください。

        ### 🚨 【重要度: 高・中・低】 (指摘のタイトル)
        - **カテゴリ**: (バグ / 仕様違反 / 保守性 / パフォーマンス のいずれか)
        - **問題点**: (何がルールやベストプラクティスに違反しているか簡潔に)
        - **理由**: (なぜこれを修正しなければならないのか、影響範囲は何か)

        **💡 修正案**:
        具体的な修正コードを提示してください。

        【全体的なレビュー方針】
        - 単なるスタイル（インデントなど）の指摘よりも、アーキテクチャの欠陥、状態管理の不整合、ゲームロジックのバグに焦点を当ててください。
        - プロジェクト固有のルール（特に「召喚」と「配置」の区別、スキル名ID変換）に違反している場合は、【重要度: 高】として厳しく指摘し、修正を要求してください。
        - 素晴らしいコードや、ルールを完璧に守っている複雑なロジックに対しては、褒めるコメントを残してください。

        プルリクエストをレビューする際は、以下のプロジェクト固有のコーディングルールおよび制約を遵守しているか徹底して確認してください。

        ### 📋 基本的なコーディング原則
        - **日本語の維持**: コードコメントや生成ドキュメントはすべて日本語で記述する。
        - **【絶対厳守】すべての関数へのJSDocおよびシステム処理コメントの徹底**: 新規作成・変更・追加するすべての関数（ヘルパー、コンポーネント、ユーティリティ問わず）に概要・目的・引数（@param）・戻り値（@return）を明記したJSDocを記載する。ゲームシステムやバトルロジックに関わる処理には、人間が見て一目で挙動や目的が理解できる具体的な解説コメントを必ず記載する。
        - **【絶対厳守】オブジェクトプロパティ・関数戻り値の構造変更時における影響調査**: プロパティや戻り値を削除・置換・再構築する際、呼び出し側システム（対戦画面、モーダル、UI等）が要求しているプロパティ（hp, playmat, color 等）が欠落・消失しないことを必ず実地調査・検証する。セーブデータマージ時はセーブデータ由来の追加属性消失を防ぐ順序を守る。
        - **DOM処理の廃止と状態管理**: DOMの直接操作（jQuery等を含む）は一切行わず、Reactの状態管理（State）に処理を任せる。
        - **jQueryの使用禁止**: jQueryなどの古いライブラリは使用せず、Vanilla JSおよびモダンフレームワークの標準機能を使用する。
        - **関心の分離 (Separation of Concerns)**: ロジック、表示、データ管理などの役割を明確に分離し、密結合を避ける。
        - **DRY原則の徹底**: 共通処理は共通関数やモジュールにまとめ、コードの重複を徹底的に排除する。
        - **定数の徹底**: マジックナンバーを排除し、定数定義を利用する。
        - **データ整合性の保持（最重要）**: LocalStorageやサーバー上のユーザーデータとの不整合を絶対に発生させず、ユーザーデータの消失・破損を防ぐ。
        - **CSSにおけるvhの不使用**: ビューポートの高さ指定には vh を使用せず、モバイルブラウザ等での表示乱れを防ぐために dvh（Dynamic Viewport Height）を使用する。

        ### ⚔️ 「召喚（Summon）」と「配置（Place）」の厳密な区別（絶対厳守）
        カードを場に出す処理を実装・レビューする際、以下の2種類のアクションを絶対に混同せず分離すること。
        1. **「召喚（Summon）」のルール**:
           - 定義: 手札からのプレイ、または制約ルール（伝説・生贄・挑戦・頂点）を満たしてカードを場に出すメインアクション。召喚時スキル（オンプレイ能力）が発動する。
           - 該当アクション・スキル一覧 (内部ID):
             - 手札プレイ: 手札からのカード通常召喚（メイン操作）
             - 「召喚」スキル: summon（手札からの召喚、旧名: 詠唱 / chant を統合）
             - 「召集」スキル: assemble（デッキからの召喚）
             - 「号令」スキル: call（デッキトップからの召喚）
             - 「鍛造」スキル: forge
             - 「狂気」スキル: madness（手札から捨てられた時の召喚）
             - リーダースキル「試練の宮殿」: dungeon_summon_leader
           - 制約チェック: 【有効 (true)】。伝説（legendary: 中央のみ）、生贄（takeover: 配置済みレーンのみ）、挑戦（challenge: 正面に敵がいるレーン）、頂点（apex: 自分場に伝説が必要）などの配置制約ルールに必ず従う。
           - 実装基準: レーン選択では waitPlayerLaneSelection(..., checkConstraints = true) を使用し、配置確定後に resolveOnPlaySkill(...) を呼び出して召喚時オンプレイ能力を発動する。
           - 画面ボタン表記: 「召喚を完了」
        2. **「配置（Place）」のルール**:
           - 定義: スキル効果やリーダースキルによって、カードやトークンを制約ルールを無視して場に直接置く特殊アクション。原則として召喚時スキルは発動しない。
           - 該当アクション・スキル一覧 (内部ID):
             - 「復活」スキル: resurrect（自分の墓地からの配置）
             - 「傀儡」スキル: puppet（相手の墓地からの配置）
             - 「分身」スキル: clone（隣接レーンへの分身トークン配置）
             - 「使役」スキル: servant（トークン配置）
             - 「奇襲」スキル: ambush（トークン配置後に即攻撃）
             - リーダースキル「竜王の降臨」: dragon_summon
             - リーダースキル「焦熱のプレリュード」: dragon_high_ritual
             - リーダースキル「魔王の化身」: satan_avatar
             - リーダースキル「聖なる進軍」: holy_march
             - リーダースキル「暗黒の軍勢」: evil_march
             - リーダースキル「棺の解放」: devilhunter_resurrect
             - リーダースキル「オーバードライブ」: overdrive
             - リーダースキル「魔宴の儀」: warlock_place_demons
             - リーダースキル「鉄の行進」: iron_march
             - リーダースキル「ラスト・バタリオン」: last_battalion
             - リーダースキル「百鬼夜行」: night_parade
             - リーダースキル「連携攻撃」: elf_polarbear_combo
           - 制約チェック: 【無効 (false)】。伝説や生贄などの通常の配置制約は無視する（封印レーンを除く任意のレーンに配置可能）。
           - 実装基準: レーン選択では waitPlayerLaneSelection(..., checkConstraints = false) を使用し、resolveOnPlaySkill(...) を呼び出さない（オンプレイ能力を抑止する）。
           - 画面ボタン表記: 「配置を完了」
        3. **共通最優先ルール**:
           - 「封印（seal）」されたレーンは、召喚・配置のどちらの手段であっても強制的に拒否・ブロックされ、配置不可能。

        ### 🔤 日本語スキル名の英語ID変換（絶対厳守）
        日本語のスキル名を内部の英語IDに変換・解釈する際、推測や類似単語を使わず、src/utils/constants/skills.js に基づいて厳密に一致させる。
        - 「変身」 ＝ metamorph (絶対に morph や transform としないこと)
        - 「変化」 ＝ morph
        - 「号令」 ＝ call
        - 「狂気」 ＝ madness
        - 「忘却」 ＝ silence (正面のカードの全能力無効)
        - 「沈黙」 ＝ oblivion (お互いの場の全カードの全能力無効)

        ### 👤 日本語キャラクター名の英語ID変換（絶対厳守）
        src/utils/constants/characters.js に基づいて厳密に一致させる。推測による代用を禁止する。
        - android ＝ 機動戦姫 アイギス
        - dragon ＝ 焔竜姫 イグニス
        - knight ＝ 聖騎士 セレスティア
        - cthulhu ＝ 深淵の呼び声 ナイア
        - elf ＝ 流浪の射手 リナ
        - cleric ＝ 狂信の聖職者 エリシア
        - devilhunter ＝ 悪魔狩り マリア
        - witch ＝ 時駆けの魔女 クロエ
        - oni ＝ 鬼血の陰陽師 カグラ
        - priest ＝ 王墓の守護者 ネフティ
        - automata ＝ 廃鉄の声 マキナ (解放制キャラ)
        - void ＝ 虚空の騎士 ゼノン (ボス)
        - succubus ＝ 隷属の女王 ヴィオラ (ボス)
        - warlock ＝ 闇の総帥 バルタザール (ボス)
        - satan ＝ 魔王 サタン (ボス)

        ### 👑 日本語リーダースキル名の英語ID変換（絶対厳守）
        リーダースキル名を内部の英語ID（action）に変換する際、推測や類似単語を使わず、src/utils/constants/characters.js の各キャラクターの leaderSkill.action に基づいて厳密に一致させる。

        ### 🃏 日本語カード名の英語ID変換（絶対厳守）
        カード名を内部英語ID（id）に変換する際、推測や部分一致を禁止し、src/utils/constants/cards.js の CARD_MASTER 配列に基づいて完全一致で厳密に照合する。

        ### 🛡️ 重要判定におけるホワイトリスト方式の徹底（絶対厳守）
        - 報酬付与、カードドロップ、機能解放等の判定では、対象外を否定条件で列挙するブラックリスト方式（mode !== 'a' && mode !== 'b' ...）を禁止し、許可された対象のみを判定するホワイトリスト関数を用いる。
